function pasteOpen() { return $("#pasteModal").classList.contains("show"); }

function openPaste() {
  $("#pasteModal").classList.add("show"); $("#scrim").classList.add("show");
  renderPasteFiles();
  setTimeout(() => $("#pName").focus(), 50);
}

function closePaste() {
  $("#pasteModal").classList.remove("show");
  if (!S.drawer) $("#scrim").classList.remove("show");
}

function bindPasteFiles() {
  const input = $("#pFileInput"), zone = $("#pDrop");
  $("#pAddFiles").addEventListener("click", () => input.click());
  input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
  const hasFiles = (e) => e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files");
  let depth = 0;
  zone.addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; depth++; zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => { depth = Math.max(0, depth - 1); if (!depth) zone.classList.remove("over"); });
  // Dropping a file anywhere must never navigate away from the demo. Outside the modal it opens Paste an RFQ.
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; zone.classList.remove("over");
    if (!$("#viewer").hidden) return;
    if (!pasteOpen()) openPaste();
    addFiles(e.dataTransfer.files);
  });
  $("#pFiles").addEventListener("click", (e) => {
    const rm = e.target.closest("[data-remove]");
    if (rm) { removePasteFile(rm.dataset.remove); return; }
    const t = e.target.closest("[data-att]");
    if (t) openViewer(P.openable, Number(t.dataset.att), t, (i) => `#pFiles [data-att="${i}"]`);
  });
}

function uploadType(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (ext === "pdf" || file.type === "application/pdf") return "application/pdf";
  if (ext === "png" || file.type === "image/png") return "image/png";
  if (ext === "jpg" || ext === "jpeg" || file.type === "image/jpeg") return "image/jpeg";
  return null;
}

function addFiles(fileList) {
  const lim = S.boot.uploads, files = [...(fileList || [])], skipped = [];
  const mb = Math.round(lim.max_bytes / 1048576);
  for (const file of files) {
    const type = uploadType(file);
    const base = { key: "u" + (++P.seq), name: file.name, size: file.size, media: !type ? null : type === "application/pdf" ? "pdf" : type === "image/png" ? "png" : "jpg", progress: 0 };
    if (!type || !lim.types.includes(type)) { P.uploads.push(Object.assign(base, { state: "error", error: "Only PDF, PNG, and JPG files can be attached." })); continue; }
    if (file.size > lim.max_bytes) { P.uploads.push(Object.assign(base, { state: "error", error: `Over the ${mb} MB limit (${fmtBytes(file.size)}).` })); continue; }
    if (!file.size) { P.uploads.push(Object.assign(base, { state: "error", error: "The file is empty." })); continue; }
    if (P.uploads.filter((u) => u.state !== "error").length >= lim.max_files) { skipped.push(file.name); continue; }
    const u = Object.assign(base, { state: "uploading", file, type });
    if (type !== "application/pdf" && window.URL && URL.createObjectURL) u.localUrl = URL.createObjectURL(file);
    P.uploads.push(u);
    startUpload(u);
  }
  if (skipped.length) toast(`Up to ${lim.max_files} files per email. Not added: ${skipped.join(", ")}.`);
  const bad = P.uploads.filter((u) => u.state === "error" && !u.toasted);
  if (bad.length) { bad.forEach((u) => { u.toasted = true; }); if (!skipped.length) toast(bad.length === 1 ? `${bad[0].name}: ${bad[0].error}` : `${bad.length} files could not be attached. See the red tiles.`); }
  renderPasteFiles();
}

function startUpload(u) {
  const xhr = new XMLHttpRequest();
  u.xhr = xhr; u.netError = false;
  const current = () => u.xhr === xhr;  // events from a request that was replaced or cancelled are ignored
  xhr.open("POST", "/api/uploads");
  xhr.setRequestHeader("Content-Type", u.type);
  xhr.setRequestHeader("X-File-Name", encodeURIComponent(u.name));
  xhr.upload.onprogress = (e) => { if (current() && e.lengthComputable) { u.progress = e.loaded / e.total; updateUploadTile(u); } };
  xhr.upload.onload = () => { if (current() && u.state === "uploading") { u.state = "reading"; u.progress = 1; renderPasteFiles(); } };
  xhr.onload = () => {
    if (!current()) return;
    let data = {};
    try { data = JSON.parse(xhr.responseText || "{}"); } catch (e) { /* not JSON */ }
    u.xhr = null;
    if (xhr.status >= 200 && xhr.status < 300 && data.ok && data.upload) { u.state = "done"; u.att = data.upload; }
    else { u.state = "error"; u.error = (data.error && data.error.message) || (xhr.status === 401 ? "Sign in again, then retry." : `Upload failed (${xhr.status || "no response"}).`); toast(`${u.name}: ${u.error}`); u.toasted = true; }
    renderPasteFiles();
  };
  xhr.onerror = () => {
    if (!current()) return;
    u.xhr = null; u.state = "error"; u.netError = true; u.error = "The upload failed. Check the connection and try again."; u.toasted = true;
    toast(`${u.name}: ${u.error}`); renderPasteFiles();
  };
  xhr.send(u.file);
}

/* After a server restart: the old server's memory held the uploaded bytes, but the browser still has each
   file, so it sends them again. The chosen example keeps the sample files the user had not removed. */
function restorePasteAfterRestart(example, names) {
  const x = example ? (S.boot.paste_examples || [])[example.idx] : null;
  if (x && x.label === example.label) {
    $("#pExample").value = String(example.idx);
    P.example = example.idx;
    P.exampleFiles = (x.attachments || []).filter((a) => a.url && names.includes(a.name));
  }
  for (const u of P.uploads) {
    if (!u.file || (u.state === "error" && !u.netError)) continue;
    const old = u.xhr; u.xhr = null;
    if (old) old.abort();
    Object.assign(u, { state: "uploading", progress: 0, att: null, error: "", toasted: false });
    startUpload(u);
  }
  renderPasteFiles();
}

function updateUploadTile(u) {
  const wrap = $(`#pFiles [data-key="${u.key}"]`);
  if (!wrap) return;
  const p = Math.round(u.progress * 100), bar = wrap.querySelector(".fprog i"), label = wrap.querySelector(".fprev.busy > span:not(.spin):not(.fprog)");
  if (bar) bar.style.width = p + "%";
  if (label && u.state === "uploading") label.textContent = `Uploading ${p}%`;
}

function removePasteFile(key) {
  if (key.startsWith("x")) { P.exampleFiles.splice(Number(key.slice(1)), 1); }
  else {
    const i = P.uploads.findIndex((u) => u.key === key);
    if (i >= 0) { const u = P.uploads[i]; if (u.xhr) u.xhr.abort(); if (u.localUrl) URL.revokeObjectURL(u.localUrl); P.uploads.splice(i, 1); }
  }
  renderPasteFiles();
  const next = $("#pFiles [data-remove]") || $("#pAddFiles");
  if (next) next.focus();
}

function clearPasteFiles() {
  for (const u of P.uploads) { if (u.xhr) u.xhr.abort(); if (u.localUrl) URL.revokeObjectURL(u.localUrl); }
  P.uploads = []; P.exampleFiles = [];
  renderPasteFiles();
}

function uploadsBusy() { return P.uploads.some((u) => u.state === "uploading" || u.state === "reading"); }

function renderPasteFiles() {
  const items = [
    ...P.exampleFiles.map((att, i) => ({ key: "x" + i, att })),
    ...P.uploads.map((u) => ({ key: u.key, att: u.att || { name: u.name, kind: "upload", media: u.media, size: u.size }, u })),
  ];
  const openable = items.filter((it) => !it.u || it.u.state === "done");
  P.openable = openable.map((it) => it.att);
  $("#pFiles").innerHTML = items.map((it) => {
    const vi = openable.indexOf(it);
    const u = it.u;
    return tileHtml(it.att, { idx: vi >= 0 ? vi : null, key: it.key, removable: true, state: u && u.state !== "done" ? u.state : null,
      progress: u ? u.progress : 0, error: u ? u.error : "", localUrl: u ? u.localUrl : "" });
  }).join("");
  const lim = S.boot.uploads, n = P.uploads.filter((u) => u.state !== "error").length;
  $("#pFilesCount").textContent = `${n} of ${lim.max_files} files${P.exampleFiles.length ? `, plus ${plural(P.exampleFiles.length, "sample file")}` : ""}`;
  $("#pAddFiles").disabled = n >= lim.max_files;
  const busy = uploadsBusy(), btn = $("#pSubmit");
  if (!btn.dataset.sending) {
    btn.disabled = busy;
    btn.innerHTML = busy ? `<span class="spin"></span>Waiting for uploads` : `${ic("play", "play")}Route with Jev`;
  }
  const errs = P.uploads.filter((u) => u.state === "error").length;
  $("#pFootNote").textContent = errs ? `${plural(errs, "file")} not attached. Remove ${errs === 1 ? "it" : "them"} or try again.` : "";
}

async function submitPaste(ev) {
  ev.preventDefault();
  if (uploadsBusy()) { toast("Wait for the uploads to finish."); return; }
  const payload = {
    from_name: $("#pName").value, from_email: $("#pEmail").value, subject: $("#pSubject").value, body: $("#pBody").value,
    attachments: $("#pAtt").value, uploads: P.uploads.filter((u) => u.state === "done" && u.att).map((u) => u.att.id),
  };
  if (P.example != null) { payload.example = P.example; payload.example_files = P.exampleFiles.map((a) => a.name); }
  if (!payload.subject.trim() && !payload.body.trim()) { toast("Add a subject or a body first."); return; }
  const btn = $("#pSubmit");
  if (btn.dataset.sending) return;
  btn.dataset.sending = "1"; btn.disabled = true;
  try {
    const r = await api("/api/emails", payload);
    S.emails[r.id] = r.email;
    // The next paste starts from a clean form. Keeping the text but not the example's files would let a
    // re-send go out without the drawing that carried the ITAR marking.
    $("#pasteForm").reset(); P.example = null;
    clearPasteFiles();
    closePaste();
    applyState(r.state);
    renderAll();
    select(r.id);
    const row = S.dom.rows.get(r.id);
    if (row) row.el.scrollIntoView({ block: "nearest", behavior: reducedMotion() ? "auto" : "smooth" });
  } catch (e) { toast(e.message); }
  finally { delete btn.dataset.sending; renderPasteFiles(); }
}

/* ---------------------------------------------------------------- file viewer */
const VW = { list: [], idx: 0, returnEl: null, selFor: null, model: null, token: 0, stageToken: 0, texts: new Map(), meshes: new Map(),
  regionsCache: new Map(), panelOpen: true, regionsOn: false, reg: null, regRO: null, emailId: null };
try { VW.panelOpen = localStorage.getItem("rfq.jevPanel") !== "0"; VW.regionsOn = localStorage.getItem("rfq.regions") === "1"; } catch (e) { /* storage blocked */ }

function bindViewer() {
  $("#vClose").addEventListener("click", closeViewer);
  $("#vPrev").addEventListener("click", () => moveViewer(-1));
  $("#vNext").addEventListener("click", () => moveViewer(1));
  const toggle = (open) => {
    VW.panelOpen = open;
    try { localStorage.setItem("rfq.jevPanel", open ? "1" : "0"); } catch (e) { /* storage blocked */ }
    $("#vPanel").classList.toggle("collapsed", !open);
    $("#vPanelBtn").setAttribute("aria-pressed", open ? "true" : "false");
  };
  $("#vPanelBtn").addEventListener("click", () => toggle(!VW.panelOpen));
  $("#vPanelClose").addEventListener("click", () => { toggle(false); $("#vPanelBtn").focus(); });
  $("#vRegionsBtn").addEventListener("click", () => {
    VW.regionsOn = !VW.regionsOn;
    try { localStorage.setItem("rfq.regions", VW.regionsOn ? "1" : "0"); } catch (e) { /* storage blocked */ }
    const att = VW.list[VW.idx];
    $("#vRegionsBtn").setAttribute("aria-pressed", VW.regionsOn && att && canRegions(att) ? "true" : "false");
    if (att) renderStage(att);
  });
  if (!window.ResizeObserver) window.addEventListener("resize", layoutRegions);
}

function openViewer(list, idx, returnEl, selFor, emailId) {
  if (!list || !list.length || !(idx >= 0 && idx < list.length)) return;
  VW.list = list.slice(); VW.idx = idx; VW.returnEl = returnEl || document.activeElement; VW.selFor = selFor || null;
  VW.emailId = emailId || null;
  $("#viewer").hidden = false;
  document.body.classList.add("viewing");
  renderViewer();
  $("#vClose").focus();
}

function closeViewer() {
  if ($("#viewer").hidden) return;
  VW.token++; VW.stageToken++; VW.emailId = null;
  destroyModel(); dropRegions();
  $("#vStage").innerHTML = ""; $("#vPanelBody").innerHTML = "";
  $("#viewer").hidden = true;
  document.body.classList.remove("viewing");
  let el = VW.selFor ? document.querySelector(VW.selFor(VW.idx)) : null;
  if (!el && VW.returnEl && VW.returnEl.isConnected) el = VW.returnEl;
  if (el) el.focus({ preventScroll: false });
}

function moveViewer(step) {
  if (VW.list.length < 2) return;
  VW.idx = (VW.idx + step + VW.list.length) % VW.list.length;
  renderViewer();
}

function destroyModel() { if (VW.model) { VW.model.destroy(); VW.model = null; } }

function vmsg(title, text, icon) {
  return `<div class="vmsg"><span class="vmsg-i">${ic(icon || "info", "lg")}</span><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`;
}

const GONE_TEXT = "Uploaded files are kept in memory only, and the server no longer has this one (it restarted, or it needed the room). Jev already read its text when the email was routed.";

function renderViewer() {
  const att = VW.list[VW.idx], token = ++VW.token;
  renderViewerHead(att);
  renderStage(att);
  renderJevPanel(att, token);
}

/* The top bar of the viewer for one file. When the file changes under a focused control that then
   hides (Detected regions or Open on a STEP file), focus moves to Next file, or Close, instead of
   dropping to the page behind the viewer. */
function renderViewerHead(att) {
  const t = fileType(att), had = document.activeElement, inViewer = had && $("#viewer").contains(had);
  const icon = $("#vIcon"); icon.className = "ficon " + t; icon.innerHTML = ic(TYPE_ICON[t]);
  $("#vName").textContent = att.name; $("#vName").title = att.name;
  const legend = LEGENDS[att.legend] ? ` · ${LEGENDS[att.legend]} legend` : "";
  $("#vMeta").textContent = metaLine(att, true) + legend + (att.title ? ` · ${att.title}` : "");
  $("#vNav").hidden = VW.list.length < 2;
  $("#vPos").textContent = `${VW.idx + 1} of ${VW.list.length}`;
  const file = hasFile(att);
  const dl = $("#vDownload"); dl.hidden = !file;
  if (file) { dl.href = withParam(att.url, "download=1"); dl.setAttribute("download", att.name); } else dl.removeAttribute("href");
  const op = $("#vOpen"); op.hidden = !(file && (t === "pdf" || t === "image"));
  if (!op.hidden) op.href = att.url; else op.removeAttribute("href");
  $("#vPanel").classList.toggle("collapsed", !VW.panelOpen);
  $("#vPanelBtn").setAttribute("aria-pressed", VW.panelOpen ? "true" : "false");
  const rb = $("#vRegionsBtn"), regions = canRegions(att);
  rb.hidden = !regions;
  rb.setAttribute("aria-pressed", VW.regionsOn && regions ? "true" : "false");
  if (inViewer && (had.hidden || !had.getClientRects().length)) {
    const next = $("#vNext");
    (next.getClientRects().length ? next : $("#vClose")).focus();
  }
}

/* The server reads files in the background (OCR can take a while on a small host). When it finishes
   one of the files open in the viewer, the label, the OCR note, and the regions button follow; the
   stage is redrawn only when what it shows changes, so a PDF or a turned 3D model keeps its place. */
function refreshViewerFiles() {
  if ($("#viewer").hidden || !VW.emailId) return;
  const e = S.emails[VW.emailId], old = VW.list[VW.idx];
  if (!e || !old || !Array.isArray(e.attachments) || e.attachments.length !== VW.list.length) return;
  const att = e.attachments[VW.idx];
  if (!att || att.name !== old.name) return;
  VW.list = e.attachments.slice();
  const sig = (a) => [a.label, a.text_from, a.legend, a.size, a.pages, a.width, a.height, a.title].join("|");
  if (sig(att) === sig(old) && att.url === old.url && canRegions(att) === canRegions(old)) return;
  renderViewerHead(att);
  if (att.url !== old.url || canRegions(att) !== canRegions(old)) renderStage(att);
  if (att.text_from !== old.text_from) renderJevPanel(att, ++VW.token);
}

/* The big area of the viewer: the file itself, or page 1 with the detected regions on it. It is
   redrawn on its own when "Detected regions" is switched, so the text panel keeps its place. */
function renderStage(att) {
  const t = fileType(att), token = ++VW.stageToken;
  destroyModel(); dropRegions();
  const file = hasFile(att), dl = $("#vDownload"), op = $("#vOpen");
  const stage = $("#vStage");
  stage.className = "vstage";
  const gone = () => {  // the server dropped this upload after the page learned about it
    if (token !== VW.stageToken) return;
    stage.innerHTML = vmsg("This file is no longer in memory", GONE_TEXT, "alert");
    dl.hidden = true; op.hidden = true;
  };
  if (att.kind === "name_only") {
    stage.innerHTML = vmsg("Name only, no file", "The sender listed this file name, but the file itself did not come with the email. Jev sees only the name.", "file");
  } else if (!file) {
    stage.innerHTML = vmsg("This file is no longer in memory", GONE_TEXT, "alert");
  } else if (VW.regionsOn && canRegions(att)) {
    renderRegions(att, stage, token);
  } else if (t === "pdf") {
    const show = () => { if (token === VW.stageToken) stage.innerHTML = `<iframe class="vpdf" src="${esc(att.url)}" title="${esc(att.name)}"></iframe>`; };
    if (att.kind === "upload") {
      stage.innerHTML = `<div class="vmsg"><span class="spin"></span></div>`;
      fetch(att.url, { method: "HEAD" }).then((r) => {
        if (token !== VW.stageToken) return;
        if (r.status === 410 || r.status === 404) gone(); else show();
      }).catch(show);
    } else show();
  } else if (t === "image") {
    stage.innerHTML = `<div class="vimg"><img alt="${esc(att.name)}"></div>`;
    const img = stage.querySelector("img");
    img.onerror = () => {
      if (att.kind === "upload") gone();
      else if (token === VW.stageToken) stage.innerHTML = vmsg("The image could not be loaded", "Try the Download button instead.", "alert");
    };
    img.src = att.url;
  } else if (att.kind === "model" && att.mesh) {
    stage.classList.add("model");
    stage.innerHTML = `<div class="v3d"><canvas tabindex="0" role="img" aria-label="Interactive 3D view of ${esc(att.name)}. Drag to rotate, scroll or pinch to zoom, double-click to reset."></canvas>
        <div class="v3d-load"><span class="spin"></span>Loading the model</div>
        <div class="v3d-tools"><button type="button" class="btn small" id="vReset">${ic("reset", "sm")}Reset view</button></div>
        <div class="v3d-hint">Drag to rotate · scroll or pinch to zoom · double-click to reset</div></div>${propsHtml(att)}`;
    loadMesh(att.mesh).then((mesh) => {
      if (token !== VW.stageToken) return;
      const load = stage.querySelector(".v3d-load"); if (load) load.remove();
      VW.model = makeModelView(stage.querySelector("canvas"), mesh);
      $("#vReset").onclick = () => VW.model && VW.model.reset();
    }).catch(() => {
      if (token !== VW.stageToken) return;
      const box = stage.querySelector(".v3d");
      box.innerHTML = `${att.thumb ? `<img src="${esc(att.thumb)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply">` : ""}<div class="v3d-hint">The 3D preview could not be loaded. The Download button gets the STEP file.</div>`;
    });
  } else {
    stage.innerHTML = vmsg("No preview for this file", "Use the Download button to open it.", "file");
  }
}

/* ---- detected regions (layout model) ---- */
// Plain-word names and one color per class (all dark enough for white chip text).
const REGION_CLASSES = {
  title_block: ["Title block", "#2a78d6"], revision_block: ["Revisions", "#7a4fd0"], notes: ["Notes", "#0b7d5c"],
  export_legend: ["Export legend", "#d03b3b"], proprietary_notice: ["Proprietary notice", "#a85a00"],
  form_header: ["Form header", "#0b7a90"], line_table: ["Line items", "#c0307a"], requirements: ["Requirements", "#5f6b12"],
};
function regionClass(label) {
  // Own keys only: a label like "constructor" would otherwise find Object.prototype's.
  if (Object.prototype.hasOwnProperty.call(REGION_CLASSES, label)) return REGION_CLASSES[label];
  const words = String(label || "region").replace(/_/g, " ");
  return [words.charAt(0).toUpperCase() + words.slice(1), "#5b5f68"];
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function canRegions(att) {
  const t = fileType(att), F = (S.boot && S.boot.features) || {};
  // Without the layout model the button would only lead to "not available", and a saved "on" would
  // swap every PDF for a static page image, so the viewer offers regions only when the server has it.
  return !!(att && att.page_url && att.regions_url && hasFile(att) && (t === "pdf" || t === "image") && F.layout !== false);
}

function dropRegions() {
  if (VW.regRO) { VW.regRO.disconnect(); VW.regRO = null; }
  VW.reg = null;
}

function renderRegions(att, stage, token) {
  stage.innerHTML = `<div class="vreg">
      <div class="vreg-view">
        <div class="vreg-page"><img alt="${esc(`Page 1 of ${att.name}`)}"><div class="vreg-boxes" aria-hidden="true"></div></div>
        <div class="vreg-load"><span class="spin"></span>Loading page 1</div>
      </div>
      <div class="vreg-legend" aria-live="polite"><span class="vreg-note"><span class="spin"></span>Finding regions on page 1</span></div>
    </div>`;
  const view = stage.querySelector(".vreg-view"), page = stage.querySelector(".vreg-page"), img = page.querySelector("img");
  const R = VW.reg = { view, page, w: 0, h: 0 };
  const live = () => token === VW.stageToken && VW.reg === R;  // not replaced by another file or an error
  img.onload = () => {
    if (token !== VW.stageToken) return;
    R.w = img.naturalWidth; R.h = img.naturalHeight;
    const load = view.querySelector(".vreg-load"); if (load) load.remove();
    layoutRegions();
    page.classList.add("ready");
    askRegions(att, stage, live);
  };
  img.onerror = () => {
    if (token !== VW.stageToken) return;
    dropRegions();
    stage.innerHTML = vmsg("The page image could not be made", "This server could not draw page 1 of this file. Turn off Detected regions to see the file itself.", "alert");
  };
  img.src = att.page_url;
  if (window.ResizeObserver) { VW.regRO = new ResizeObserver(layoutRegions); VW.regRO.observe(view); }
}

/* The regions are asked for once the page image is here. The server draws the page for both requests,
   and on a small host (a tenth of a CPU) two page renders at once each take twice as long; after the
   image, the server finds the page in its cache and only runs the detector. */
function askRegions(att, stage, live) {
  getJson(att.regions_url, VW.regionsCache).then((res) => {
    // "Not available" is not kept (the server does not keep it either): the model can be installed while
    // the server runs, and turning regions off and on, or coming back to the file, should then find it.
    if (res && res.available === false) VW.regionsCache.delete(att.regions_url);
    if (!live()) return;
    if (!res || typeof res.available !== "boolean") throw new Error("the server sent an unexpected answer");
    drawRegions(res, stage);
  }).catch((err) => {
    if (!live()) return;
    VW.regionsCache.delete(att.regions_url);
    const legend = stage.querySelector(".vreg-legend");
    if (legend) legend.innerHTML = `<span class="vreg-note warn">${ic("alert", "sm")}<span>Could not load the detected regions (${esc(err.message || "request failed")}). The page is shown without them.</span></span>`;
  });
}

function drawRegions(res, stage) {
  const legend = stage.querySelector(".vreg-legend"), boxes = stage.querySelector(".vreg-boxes");
  const why = typeof res.error === "string" && res.error ? res.error : "";
  if (!res.available && why) {
    legend.innerHTML = `<span class="vreg-note warn">${ic("alert", "sm")}<span>The layout detector could not run on this server (${esc(why)}), so no regions are drawn. This is page 1 as the detector would see it.</span></span>`;
    return;
  }
  if (!res.available) {
    legend.innerHTML = `<span class="vreg-note">${ic("info", "sm")}<span>The layout detector is not available on this server (its model, <code>models/rfq_layout.onnx</code>, is not installed), so no regions are drawn. This is page 1 as the detector would see it.</span></span>`;
    return;
  }
  const W = Number(res.width) || (VW.reg && VW.reg.w) || 0, H = Number(res.height) || (VW.reg && VW.reg.h) || 0;
  // isFinite(null) and isFinite("") are true, so a box of nulls would be drawn at the page corner.
  const num = (v) => (typeof v === "number" || (typeof v === "string" && v.trim() !== "")) && isFinite(v);
  const f = (v, d) => clamp(Number(v) / d, 0, 1);
  const regions = (Array.isArray(res.regions) ? res.regions : []).filter((r) => r && Array.isArray(r.box) && r.box.length === 4 && r.box.every(num)).map((r) => {
    const x0 = f(Math.min(r.box[0], r.box[2]), W), y0 = f(Math.min(r.box[1], r.box[3]), H);
    const x1 = f(Math.max(r.box[0], r.box[2]), W), y1 = f(Math.max(r.box[1], r.box[3]), H);
    return { label: r.label, x0, y0, x1, y1, conf: num(r.conf) ? Math.round(Number(r.conf) * 100) : null };
  }).filter((r) => r.x1 > r.x0 && r.y1 > r.y0);  // a box off the page, or with no area, has nothing to show
  if (!W || !H || !regions.length) {
    legend.innerHTML = why
      ? `<span class="vreg-note warn">${ic("alert", "sm")}<span>The layout model could not read page 1 (${esc(why)}). The page is shown without regions.</span></span>`
      : `<span class="vreg-note">${ic("info", "sm")}<span>The layout model found no regions on page 1.</span></span>`;
    return;
  }
  const found = new Map();
  boxes.innerHTML = regions.map(({ label, x0, y0, x1, y1, conf }) => {
    const [name, color] = regionClass(label);
    found.set(label, { name, color, n: ((found.get(label) || {}).n || 0) + 1 });
    return `<div class="vreg-box" data-x="${x0}" data-y="${y0}" style="left:${x0 * 100}%;top:${y0 * 100}%;width:${(x1 - x0) * 100}%;height:${(y1 - y0) * 100}%;--c:${color};--bg:${rgba(color, 0.1)}"><span class="vreg-chip">${esc(name)}${conf != null ? `<b>${conf}%</b>` : ""}</span></div>`;
  }).join("");
  // The legend follows the model's class order, so the same class always sits in the same place.
  const order = Object.keys(REGION_CLASSES);
  const keys = [...found.entries()].sort((a, b) => ((order.indexOf(a[0]) + 99) % 99) - ((order.indexOf(b[0]) + 99) % 99));
  const said = regions.map((r) => `${regionClass(r.label)[0]}${r.conf != null ? ` ${r.conf}%` : ""}`).join(", ");
  legend.innerHTML = keys.map(([, k]) => `<span class="vreg-key"><span class="vreg-sw" style="--c:${k.color};--bg:${rgba(k.color, 0.18)}"></span>${esc(k.name)}${k.n > 1 ? ` <span class="n">${k.n}</span>` : ""}</span>`).join("")
    + `<span class="vreg-meta">Layout model, page 1${num(res.seconds) ? `, ${Number(res.seconds).toFixed(1)} s` : ""}</span>`
    + `<span class="sr-only">Detected regions: ${esc(said)}.</span>`;
  layoutRegions();
}

/* Size the page to fit the stage (the boxes are in percent, so they follow), then keep each label
   chip on the page: inside its box near the top edge, and anchored right near the right edge. */
function layoutRegions() {
  const R = VW.reg;
  if (!R || !R.view.isConnected || !R.w || !R.h) return;
  const W = R.view.clientWidth, H = R.view.clientHeight;
  if (!W || !H) return;
  const s = Math.min(W / R.w, H / R.h);
  const w = Math.max(1, Math.floor(R.w * s)), h = Math.max(1, Math.floor(R.h * s));
  R.page.style.width = w + "px"; R.page.style.height = h + "px";
  for (const box of R.page.querySelectorAll(".vreg-box")) {
    const chip = box.firstElementChild;
    box.classList.toggle("chip-in", Number(box.dataset.y) * h < chip.offsetHeight + 2);
    box.classList.toggle("chip-r", Number(box.dataset.x) * w + chip.offsetWidth > w);
  }
}

function propsHtml(att) {
  const m = att.model || {};
  const units = m.units === "mm" ? "Millimeters" : m.units === "in" ? "Inches" : m.units;
  const rows = [["Part number", att.part_number], ["Rev", att.rev], ["Title", att.title], ["Units", units], ["Bounding box", m.bbox],
    ["Format", `STEP ${m.schema || "AP214"}`], ["Originating system", m.system], ["File size", fmtBytes(att.size)]].filter((r) => r[1]);
  return `<dl class="vprops">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
}

function getJson(url, cache) {
  if (!cache.has(url)) {
    const p = fetch(url).then(async (r) => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error((data && typeof data.error === "string" && data.error) || r.statusText), { status: r.status });
      return data;
    });
    p.catch(() => cache.delete(url));
    cache.set(url, p);
  }
  return cache.get(url);
}
const loadMesh = (url) => getJson(url, VW.meshes);

/* Where the text came from. A scan, photo, or screenshot has no text layer, so Tesseract read it:
   say so, with its confidence, because OCR text can hold misreadings that the email never had. */
function textFromNote(att) {
  const tf = String(att.text_from || ""), o = /^OCR/i.test(tf) ? ocrInfo(tf) : null;
  if (o) {
    const what = att.media === "jpg" ? "This file is a photo with no text layer"
      : att.media === "png" ? "This file is an image (a screenshot) with no text layer" : "This file has no text layer (a scan)";
    const low = o.conf != null && o.conf < LOW_OCR;
    return `<div class="vp-ocr${low ? " low" : ""}">${ic("scan", "sm")}<span>${what}, so its text was read with Tesseract OCR${o.conf != null ? `, confidence ${o.conf}%` : ""}. Jev reads this OCR text.${low ? " At this confidence some words may be misread: check part numbers and dates against the file." : ""}</span></div>`;
  }
  if (tf === "text layer") return `<p class="vp-note">Read from the PDF's text layer, so no OCR was needed.</p>`;
  if (tf === "STEP header") return `<p class="vp-note">Read from the STEP file's header: part number, title, units, and the CAD system that wrote it.</p>`;
  return "";
}

function renderJevPanel(att, token) {
  const body = $("#vPanelBody");
  if (!att.text_url) {
    body.innerHTML = `<p class="vp-note">This attachment is a file name with no file behind it, so Jev gets only the name.</p><pre class="jtext">${esc(att.name)}</pre>`;
    return;
  }
  body.innerHTML = `<div class="vp-loading"><span class="spin"></span>Loading what Jev reads</div>`;
  getJson(att.text_url, VW.texts).then((r) => {
    if (token !== VW.token) return;
    const trunc = r.truncated ? r.text.replace(/\s*\[truncated\]$/, "").length : 0;
    let warn = "";
    if (att.kind === "upload" && att.media === "pdf" && S.boot.uploads && !S.boot.uploads.pdf_text) warn = `<div class="vp-warn">This server cannot read PDF text (pypdf is not installed), so Jev sees only this file's name.</div>`;
    else if (att.kind === "upload" && att.text_error) warn = `<div class="vp-warn">The text of this PDF could not be read (${esc(att.text_error)}). Jev sees the file name and this note.</div>`;
    body.innerHTML = `<p class="vp-note">Jev gets this text with the email body, in the same single call, labeled with the file name <b>${esc(r.name || att.name)}</b>.</p>
      ${textFromNote(att)}${warn}<pre class="jtext">${esc(r.text)}</pre>
      ${r.truncated ? `<p class="vp-note" style="margin-top:8px">Shortened for Jev: it reads the first ${trunc.toLocaleString()} of ${Number(r.full_chars || 0).toLocaleString()} characters. Each email has a fixed text budget for its attachments.</p>` : ""}`;
  }).catch((e) => {
    if (token !== VW.token) return;
    body.innerHTML = e.status === 410
      ? `<p class="vp-note">This uploaded file is no longer in memory, so its text is not available here.</p>`
      : `<p class="vp-note">Could not load the text (${esc(e.message)}).</p>`;
  });
}

/* A small 3D viewer: orthographic view of a polygon mesh (z up, faces counterclockwise from outside),
   flat shading, feature and silhouette edges, faces ordered by a painter's sort that respects
   "this face is in front of that face's plane" before falling back to depth. */
function makeModelView(canvas, mesh) {
  const ctx = canvas.getContext("2d");
  const P = mesh.vertices || [];
  const nV = P.length;
  const F = (mesh.faces || []).filter((f) => f.length >= 3 && f.every((i) => i >= 0 && i < nV));
  const nF = F.length;
  let mnx = Infinity, mny = Infinity, mnz = Infinity, mxx = -Infinity, mxy = -Infinity, mxz = -Infinity;
  for (const v of P) {
    if (v[0] < mnx) mnx = v[0]; if (v[0] > mxx) mxx = v[0];
    if (v[1] < mny) mny = v[1]; if (v[1] > mxy) mxy = v[1];
    if (v[2] < mnz) mnz = v[2]; if (v[2] > mxz) mxz = v[2];
  }
  const cx = (mnx + mxx) / 2, cy = (mny + mxy) / 2, cz = (mnz + mxz) / 2;
  const R = Math.max(1e-6, Math.hypot(mxx - mnx, mxy - mny, mxz - mnz) / 2);
  const N = new Float64Array(nF * 3);
  F.forEach((f, fi) => {  // Newell's method: robust for any planar polygon, points outward for CCW faces
    let x = 0, y = 0, z = 0;
    for (let k = 0; k < f.length; k++) {
      const a = P[f[k]], b = P[f[(k + 1) % f.length]];
      x += (a[1] - b[1]) * (a[2] + b[2]); y += (a[2] - b[2]) * (a[0] + b[0]); z += (a[0] - b[0]) * (a[1] + b[1]);
    }
    const l = Math.hypot(x, y, z) || 1;
    N[fi * 3] = x / l; N[fi * 3 + 1] = y / l; N[fi * 3 + 2] = z / l;
  });
  const NB = F.map((f) => new Int32Array(f.length).fill(-1));
  const FE = F.map((f) => new Uint8Array(f.length));
  const seen = new Map();
  F.forEach((f, fi) => {
    for (let k = 0; k < f.length; k++) {
      const a = f[k], b = f[(k + 1) % f.length];
      if (a === b) continue;
      const key = a < b ? a * nV + b : b * nV + a;
      const hit = seen.get(key);
      if (hit === undefined) { seen.set(key, [fi, k]); continue; }
      if (hit === null) { FE[fi][k] = 1; continue; }
      const [g, j] = hit;
      NB[fi][k] = g; NB[g][j] = fi;
      const dot = N[fi * 3] * N[g * 3] + N[fi * 3 + 1] * N[g * 3 + 1] + N[fi * 3 + 2] * N[g * 3 + 2];
      if (dot < 0.85) { FE[fi][k] = 1; FE[g][j] = 1; }  // a crease sharper than about 32 degrees
      seen.set(key, null);
    }
  });
  const VX = new Float64Array(nV), VY = new Float64Array(nV), VZ = new Float64Array(nV), SX = new Float64Array(nV), SY = new Float64Array(nV);
  const FN = new Float64Array(nF * 3), FD = new Float64Array(nF), vis = new Uint8Array(nF);
  const HOME = { yaw: -0.62, pitch: 0.5 };
  const L = (() => { const x = -0.42, y = -0.62, z = 0.66, l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; })();
  const BASE = [176, 188, 206];
  let yaw = HOME.yaw, pitch = HOME.pitch, zoom = 1, spinning = !reducedMotion(), raf = 0, lastT = 0, alive = true;

  function order(list) {
    const n = list.length;
    if (n > 420) return list.sort((a, b) => FD[b] - FD[a]);
    const x0 = new Float64Array(n), x1 = new Float64Array(n), y0 = new Float64Array(n), y1 = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
      for (const v of F[list[i]]) { if (SX[v] < a) a = SX[v]; if (SX[v] > b) b = SX[v]; if (SY[v] < c) c = SY[v]; if (SY[v] > d) d = SY[v]; }
      x0[i] = a; x1[i] = b; y0[i] = c; y1[i] = d;
    }
    const eps = R * 1e-4;
    const inFront = (fb, fa) => {  // every vertex of face fb lies on the viewer's side of face fa's plane
      const p = F[fa][0], nx = FN[fa * 3], ny = FN[fa * 3 + 1], nz = FN[fa * 3 + 2];
      for (const v of F[fb]) if ((VX[v] - VX[p]) * nx + (VY[v] - VY[p]) * ny + (VZ[v] - VZ[p]) * nz < -eps) return false;
      return true;
    };
    const indeg = new Int32Array(n), succ = Array.from({ length: n }, () => []);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (x1[i] <= x0[j] + 0.5 || x1[j] <= x0[i] + 0.5 || y1[i] <= y0[j] + 0.5 || y1[j] <= y0[i] + 0.5) continue;
        const jf = inFront(list[j], list[i]), iff = inFront(list[i], list[j]);
        if (jf && !iff) { succ[i].push(j); indeg[j]++; }
        else if (iff && !jf) { succ[j].push(i); indeg[i]++; }
      }
    }
    const out = [], done = new Uint8Array(n);
    for (let c = 0; c < n; c++) {
      let best = -1, bestD = -Infinity, alt = -1, altD = -Infinity;
      for (let i = 0; i < n; i++) {
        if (done[i]) continue;
        const dd = FD[list[i]];
        if (indeg[i] === 0) { if (dd > bestD) { bestD = dd; best = i; } } else if (dd > altD) { altD = dd; alt = i; }
      }
      if (best < 0) best = alt;  // a cycle: fall back to depth
      done[best] = 1; out.push(list[best]);
      for (const s of succ[best]) indeg[s]--;
    }
    return out;
  }

  function draw() {
    if (!alive) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const s = (Math.min(w, h) * 0.43 / R) * zoom, ox = w / 2, oy = h / 2 + Math.min(h * 0.02, 8);
    for (let i = 0; i < nV; i++) {
      const v = P[i], x = v[0] - cx, y = v[1] - cy, z = v[2] - cz;
      const X = x * cyw - y * syw, Y1 = x * syw + y * cyw;
      const Y = Y1 * cp - z * sp, Z = Y1 * sp + z * cp;
      VX[i] = X; VY[i] = Y; VZ[i] = Z; SX[i] = ox + X * s; SY[i] = oy - Z * s;
    }
    const list = [];
    for (let f = 0; f < nF; f++) {
      const x = N[f * 3], y = N[f * 3 + 1], z = N[f * 3 + 2];
      const X = x * cyw - y * syw, Y1 = x * syw + y * cyw;
      const Y = Y1 * cp - z * sp, Z = Y1 * sp + z * cp;
      FN[f * 3] = X; FN[f * 3 + 1] = Y; FN[f * 3 + 2] = Z;
      vis[f] = Y < -1e-4 ? 1 : 0;  // the camera looks along +Y: a face is visible when it points back at it
      if (vis[f]) { let dsum = 0; for (const v of F[f]) dsum += VY[v]; FD[f] = dsum / F[f].length; list.push(f); }
    }
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    for (const f of order(list)) {
      const face = F[f], nx = FN[f * 3], ny = FN[f * 3 + 1], nz = FN[f * 3 + 2];
      const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]), head = Math.max(0, -ny);
      const k = 0.36 + 0.5 * diff + 0.2 * head;
      const col = `rgb(${Math.min(255, BASE[0] * k) | 0},${Math.min(255, BASE[1] * k) | 0},${Math.min(255, BASE[2] * k) | 0})`;
      ctx.beginPath();
      ctx.moveTo(SX[face[0]], SY[face[0]]);
      for (let i = 1; i < face.length; i++) ctx.lineTo(SX[face[i]], SY[face[i]]);
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 0.9; ctx.stroke();  // hides hairline seams between faces
      let any = false;
      ctx.beginPath();
      for (let i = 0; i < face.length; i++) {
        const g = NB[f][i];
        if (FE[f][i] || g < 0 || !vis[g]) {
          const a = face[i], b = face[(i + 1) % face.length];
          ctx.moveTo(SX[a], SY[a]); ctx.lineTo(SX[b], SY[b]); any = true;
        }
      }
      if (any) { ctx.strokeStyle = "rgba(30,36,50,.72)"; ctx.lineWidth = 1; ctx.stroke(); }
    }
    gizmo(w, h, cyw, syw, cp, sp);
  }

  function gizmo(w, h, cyw, syw, cp, sp) {
    const ox = w - 34, oy = h - 34, len = 18;
    const axes = [["X", 1, 0, 0, "#d03b3b"], ["Y", 0, 1, 0, "#0f8f3a"], ["Z", 0, 0, 1, "#2a78d6"]].map(([t, x, y, z, c]) => {
      const X = x * cyw - y * syw, Y1 = x * syw + y * cyw;
      return { t, c, X, Y: Y1 * cp - z * sp, Z: Y1 * sp + z * cp };
    }).sort((a, b) => b.Y - a.Y);
    ctx.lineWidth = 2; ctx.font = "600 10px Inter, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const a of axes) {
      ctx.strokeStyle = a.c; ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + a.X * len, oy - a.Z * len); ctx.stroke();
      ctx.fillText(a.t, ox + a.X * (len + 8), oy - a.Z * (len + 8));
    }
  }

  const SPIN = 0.00042;  // radians per millisecond
  function frame(t) {
    raf = 0;
    if (!alive) return;
    if (spinning) { if (lastT) yaw += Math.min(64, t - lastT) * SPIN; lastT = t; }
    draw();
    if (spinning) raf = requestAnimationFrame(frame);
  }
  function schedule() { if (!raf && alive) raf = requestAnimationFrame(frame); }
  function stopSpin() { spinning = false; lastT = 0; }
  function reset() { stopSpin(); yaw = HOME.yaw; pitch = HOME.pitch; zoom = 1; schedule(); }
  const pts = new Map();
  let pinch = null;
  const onDown = (e) => {
    stopSpin();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom }; }
    canvas.classList.add("grabbing");
  };
  const onMove = (e) => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    if (pts.size === 1) {
      yaw += (e.clientX - p.x) * 0.0095;
      pitch = clamp(pitch + (e.clientY - p.y) * 0.0095, -1.5, 1.5);
    }
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size >= 2 && pinch) { const [a, b] = [...pts.values()]; zoom = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.35, 8); }
    schedule();
  };
  const onUp = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) canvas.classList.remove("grabbing"); };
  const onWheel = (e) => {
    e.preventDefault(); stopSpin();
    zoom = clamp(zoom * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)), 0.35, 8);
    schedule();
  };
  const onKey = (e) => {
    if (e.key === "+" || e.key === "=") { stopSpin(); zoom = clamp(zoom * 1.2, 0.35, 8); schedule(); }
    else if (e.key === "-" || e.key === "_") { stopSpin(); zoom = clamp(zoom / 1.2, 0.35, 8); schedule(); }
    else if (e.key === "0") reset();
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); stopSpin(); pitch = clamp(pitch + (e.key === "ArrowUp" ? 0.12 : -0.12), -1.5, 1.5); schedule(); }
  };
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("wheel", onWheel, { passive: false });
  canvas.addEventListener("dblclick", reset);
  canvas.addEventListener("keydown", onKey);
  const ro = window.ResizeObserver ? new ResizeObserver(schedule) : null;
  if (ro) ro.observe(canvas); else window.addEventListener("resize", schedule);
  schedule();
  return {
    reset,
    get spinning() { return spinning; },
    destroy() {
      alive = false;
      if (raf) cancelAnimationFrame(raf);
      if (ro) ro.disconnect(); else window.removeEventListener("resize", schedule);
      canvas.removeEventListener("pointerdown", onDown); canvas.removeEventListener("pointermove", onMove);
      canvas.removeEventListener("pointerup", onUp); canvas.removeEventListener("pointercancel", onUp);
      canvas.removeEventListener("wheel", onWheel); canvas.removeEventListener("dblclick", reset); canvas.removeEventListener("keydown", onKey);
    },
  };
}

init().catch((e) => { document.body.insertAdjacentHTML("afterbegin", `<div class="banner show bad" style="display:flex">Could not load the demo: ${esc(e.message)}</div>`); });
</script>
