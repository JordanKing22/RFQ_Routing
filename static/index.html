    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="5" rx="1"/><path d="M7 16h6"/></symbol>
  </defs>
</svg>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => (x == null || isNaN(x) ? "n/a" : Math.round(x * 100) + "%");
const ic = (name, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const reducedMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const URGENCY_LEVELS = ["No deadline", "Normal", "Soon", "Emergency"];
const LANE_ICON = { itar: "lock", orders: "package", review: "eye", filtered: "archive" };
const NOUL_BAR = { export_controlled: "export_control_restrict", quantity_given: "quantity_given", drawings_provided: "drawings_provided", outside_processing: "outside_processing" };
// Same markings router.py looks for, used only to explain where a marking was found.
const EXPORT_RE = /\b(itar|arms export control|export administration regulations|eccn|cui|controlled unclassified|dfars 252\.204-7012|u\.s\. persons only)\b/i;
const LEGENDS = { itar: "ITAR", ear: "EAR", cui: "CUI" };
const TYPE_ICON = { pdf: "file", step: "cube", image: "image", generic: "file" };

const S = {
  boot: null, state: null, lanes: {}, emails: {}, selected: null, drawer: null,
  revealed: new Set(), queue: [], queued: new Set(), laneOf: {}, fresh: new Set(),
  revealInterval: 170, revealRaf: 0, revealAcc: 0, revealLast: 0,
  useCache: true, showKey: false, clockOffset: 0, offline: false, testResult: null, drawerVersion: null,
  pollTimer: 0, renderRaf: 0, rebooting: false, fetchingEmails: false, routeLock: 0,
  dom: { lanes: {}, cards: new Map(), rows: new Map(), statsHtml: "", routeBusy: null },
};

async function api(path, body) {
  let opts = {};
  if (body !== undefined) {
    // POSTs ask for a delta too: only what changed since the version this page already has.
    const payload = S.state ? Object.assign({}, body, { since: S.state.version, boot: S.state.boot_id }) : body;
    opts = { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) };
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok && !data.ok) throw Object.assign(new Error((data && data.error && data.error.message) || (typeof data.error === "string" ? data.error : "") || res.statusText || "Request failed"), { data, status: res.status });
  return data;
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

function money(v) {
  if (v == null) return "n/a";
  if (v === 0) return "$0.00";
  if (v < 0.01) return "$" + v.toFixed(5);
  return "$" + v.toFixed(3);
}

function fmtBytes(n) {
  if (n == null || isNaN(n)) return "";
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`;
  return `${(n / 1048576).toFixed(1)} MB`;
}

function withParam(url, param) { return url + (url.includes("?") ? "&" : "?") + param; }

function orgOf(email, decision) {
  if (decision && decision.customer) return decision.customer.name;
  const cust = (S.boot.customers || {})[(email.from_email || "").split("@").pop().toLowerCase()];
  if (cust) return cust.name;
  return (email.from_email || "").split("@").pop();
}

function laneGroupClass(laneId) {
  const lane = S.lanes[laneId];
  if (!lane) return "";
  return lane.group === "estimating" && laneId !== "itar" ? "estimating" : laneId;
}

function marker(laneId) {
  return `<span class="mk ${laneGroupClass(laneId)}" aria-hidden="true"></span>`;
}

/* ---------------------------------------------------------------- init */
async function init() {
  try { S.useCache = localStorage.getItem("rfq.useCache") !== "0"; S.showKey = localStorage.getItem("rfq.showKey") === "1"; } catch (e) { /* storage blocked */ }
  const boot = await api("/api/bootstrap");
  loadBoot(boot);
  bindEvents();
  applyState(boot.state);
  schedulePoll(1200);
}

function loadBoot(boot) {
  S.boot = boot;
  boot.customers = boot.customers || {};
  boot.uploads = boot.uploads || { max_files: 5, max_bytes: 10485760, types: ["application/pdf", "image/png", "image/jpeg"], pdf_text: false };
  boot.features = boot.features || {};
  $("#detailsBtn").hidden = !boot.features.rfq_details;
  RD.map.clear();  // records belong to the server that made them
  VW.texts.clear(); VW.regionsCache.clear();  // and so do file texts and detected regions
  S.lanes = {}; for (const lane of boot.lanes) S.lanes[lane.id] = lane;
  S.emails = {}; for (const e of boot.emails) S.emails[e.id] = e;
  $("#product").textContent = boot.brand.product || "RFQ Router";
  $("#shopName").textContent = boot.shop.name;
  $("#shopSub").textContent = `${boot.shop.location} · ${boot.shop.inbox}`;
  $("#inboxAddr").textContent = boot.shop.inbox;
  document.title = `${boot.brand.product || "RFQ Router"} · ${boot.shop.name}`;
  $("#footer").innerHTML = `<span><b>Jev</b> (TypeSafe AI) makes the judgment calls. Plain code applies the routing rules.</span><span>${esc(boot.shop.disclaimer || "")}</span><span>Built by ${esc(boot.brand.by || "")}</span>`;
  $("#pPdfNote").hidden = !!boot.uploads.pdf_text;
  const mb = Math.round(boot.uploads.max_bytes / 1048576);
  $("#pDropText").innerHTML = `<b>Drop files here</b> or add them. PDF, PNG, or JPG, up to ${boot.uploads.max_files} files, ${mb} MB each.${boot.uploads.ocr ? " Scans and photos are read with OCR." : ""}`;
  buildPasteExamples();
  buildBoard();
  $("#inboxList").textContent = ""; S.dom.rows.clear();
  S.dom.statsHtml = ""; S.dom.routeBusy = null;
  renderConn();
}

async function rebootstrap() {
  // The server restarted (a Render redeploy or a sleep): its boot id changed and pasted emails are gone.
  if (S.rebooting) return;
  S.rebooting = true;
  try {
    const boot = await api("/api/bootstrap");
    const hadEmail = S.selected;
    // Paste an RFQ may be half filled in: keep the chosen example and the sample files still on it.
    const ex = P.example != null ? (S.boot.paste_examples || [])[P.example] : null;
    const keepExample = ex ? { idx: P.example, label: ex.label } : null, keepNames = P.exampleFiles.map((a) => a.name);
    closeViewer();
    resetReveal();
    S.state = null;
    loadBoot(boot);
    restorePasteAfterRestart(keepExample, keepNames);
    applyState(boot.state);
    // A pasted email is gone after a restart. Close only the drawer: Paste an RFQ may be open on top of it.
    if (S.drawer === "email" && !S.emails[hadEmail]) closeDrawer();
    else if (S.drawer === "email") renderEmailDrawer(true);
    else if (S.drawer === "settings") renderSettings();
    toast("The demo server restarted, so the board was reloaded. Route the inbox to replay saved results.");
  } catch (e) {
    /* still restarting: the next poll tries again */
  } finally { S.rebooting = false; }
}

async function fetchMissingEmails() {
  if (S.fetchingEmails || S.rebooting) return;
  S.fetchingEmails = true;
  try {
    const boot = await api("/api/bootstrap");
    if (S.state && boot.state.boot_id !== S.state.boot_id) { S.fetchingEmails = false; rebootstrap(); return; }
    for (const e of boot.emails) if (!S.emails[e.id]) S.emails[e.id] = e;
    scheduleRender();
  } catch (e) { /* try again on the next change */ } finally { S.fetchingEmails = false; }
}

function renderConn() {
  const j = S.boot.jev;
  const dot = $("#connDot"), text = $("#connText"), conn = $("#conn");
  const w = S.state ? S.state.worker : null;
  if (S.offline) { dot.className = "dot bad"; text.textContent = "Demo server not responding"; return; }
  if (!j.configured) { dot.className = "dot warn"; text.textContent = "No Jev key found"; conn.title = "Add AI_GATEWAY_API_KEY to Jev_Test/.env"; return; }
  conn.title = `${j.provider}\n${j.endpoint}\nKey ${j.key_env}: ${j.key_hint}`;
  let cls = "dot ok";
  const label = `Jev <span class="long">· ${esc(j.provider)} · </span>${esc(j.model)}`;
  if (w && w.state === "running") cls = "dot live";
  else if (w && w.state === "waiting") cls = "dot warn";
  else if (w && w.state === "stopped") cls = "dot bad";
  else if (!(w && w.calls)) cls = "dot";
  if (dot.className !== cls) dot.className = cls;
  if (text.dataset.label !== label) { text.innerHTML = label; text.dataset.label = label; }
}

function bindEvents() {
  $("#routeBtn").addEventListener("click", onRoute);
  $("#pasteBtn").addEventListener("click", openPaste);
  $("#resetBtn").addEventListener("click", async () => {
    try {
      const st = await api("/api/reset", {});
      resetReveal();
      applyState(st.state);
      toast("Board cleared. Route inbox again to replay.");
    } catch (e) { toast(e.message); }
  });
  $("#settingsBtn").addEventListener("click", () => openDrawer("settings"));
  $("#scrim").addEventListener("click", closeOverlays);
  document.addEventListener("keydown", onKeydown);
  document.querySelectorAll("[data-close=paste]").forEach((b) => b.addEventListener("click", closePaste));
  $("#pasteForm").addEventListener("submit", submitPaste);
  $("#pExample").addEventListener("change", fillExample);
  $("#inboxList").addEventListener("click", (e) => { const r = e.target.closest("[data-id]"); if (r) select(r.dataset.id); });
  $("#board").addEventListener("click", (e) => { const c = e.target.closest("[data-id]"); if (c) select(c.dataset.id); });
  const keySelect = (e) => { if (e.key !== "Enter" && e.key !== " ") return; const t = e.target.closest("[data-id]"); if (t) { e.preventDefault(); select(t.dataset.id); } };
  $("#inboxList").addEventListener("keydown", keySelect);
  $("#board").addEventListener("keydown", keySelect);
  $("#board").addEventListener("animationend", (e) => {
    if (e.animationName === "glow" && e.target.classList.contains("card")) e.target.classList.remove("fresh", "moved");
  });
  $("#drawer").addEventListener("click", (e) => {
    if (e.target.closest("#rdSrc")) { toggleSources(); return; }
    const more = e.target.closest("[data-more-key]");
    if (more) { toggleMore(more.dataset.moreKey); return; }
    if (e.target.closest("[data-rfq-retry]")) { if (S.selected) ensureRfq(S.selected, true); return; }
    const t = e.target.closest("[data-att]");
    if (!t || !S.selected) return;
    const email = S.emails[S.selected];
    if (email) openViewer(email.attachments || [], Number(t.dataset.att), t, (i) => `#drawer [data-att="${i}"]`, S.selected);
  });
  // A preview image that fails to load (for example an upload the server dropped) gets a quiet placeholder.
  document.addEventListener("error", (e) => {
    const t = e.target;
    if (t && t.tagName === "IMG" && t.closest(".fprev")) t.closest(".fprev").classList.add("broken");
  }, true);
  bindPasteFiles();
  bindViewer();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) schedulePoll(50); });
}

function onKeydown(e) {
  if (!$("#viewer").hidden) {
    if (e.key === "Escape") { e.preventDefault(); closeViewer(); }
    else if (e.key === "ArrowLeft" && !e.altKey) { e.preventDefault(); moveViewer(-1); }
    else if (e.key === "ArrowRight" && !e.altKey) { e.preventDefault(); moveViewer(1); }
    else if (e.key === "Tab") trapFocus(e, $("#viewer"));
    return;
  }
  if (e.key === "Escape") closeOverlays();
}

function trapFocus(e, root) {
  const items = [...root.querySelectorAll("button, a[href], iframe, canvas[tabindex], [tabindex='0']")]
    .filter((el) => !el.disabled && el.getClientRects().length && getComputedStyle(el).visibility !== "hidden");
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (document.activeElement === last || !root.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
}

/* ---------------------------------------------------------------- state */
function schedulePoll(ms) {
  clearTimeout(S.pollTimer);
  S.pollTimer = setTimeout(poll, ms);
}

async function poll() {
  try {
    let st = null;
    try {
      const q = S.state ? `?since=${encodeURIComponent(S.state.version)}&boot=${encodeURIComponent(S.state.boot_id)}` : "";
      st = await api("/api/state" + q);
    } catch (e) {
      S.offline = true; renderConn(); renderBanner();
    }
    if (st) {
      if (S.offline) { S.offline = false; renderBanner(); }
      try { applyState(st); } catch (e) { console.error(e); }  // a page bug, not the server being down
    }
  } finally {
    // Whatever happened above, keep polling.
    const w = S.state && S.state.worker;
    const active = (w && (w.state === "running" || w.state === "waiting" || w.queue_length > 0)) || S.queue.length;
    schedulePoll(document.hidden ? 5000 : active ? 400 : 1500);
  }
}

/* Merge a state from the server. A delta carries only the items that changed since the version we
   sent; a full state (first load, or the server lost track of us) carries everything. */
function applyState(st) {
  if (!st || !st.worker) return;
  const prev = S.state;
  if (prev && st.boot_id !== prev.boot_id) { rebootstrap(); return; }
  if (prev && st.version < prev.version) return;  // an older answer that arrived late
  let ids;
  if (!prev || st.full) {
    S.state = Object.assign({}, st, { order: st.order || (prev ? prev.order : []), items: Object.assign({}, st.items) });
    ids = S.state.order;
  } else {
    const items = prev.items;
    Object.assign(items, st.items);
    S.state = Object.assign({}, st, { order: st.order || prev.order, items });
    ids = Object.keys(st.items || {});
  }
  if (st.emails) for (const e of st.emails) S.emails[e.id] = e;
  if (st.emails && VW.emailId && st.emails.some((e) => e.id === VW.emailId)) refreshViewerFiles();
  if (S.state.order.some((id) => !S.emails[id])) fetchMissingEmails();
  S.clockOffset = st.worker.now * 1000 - Date.now();

  const idle = !S.queue.length && !S.revealRaf;
  let added = 0;
  for (const id of ids) {
    const it = S.state.items[id];
    if (!it) continue;
    const done = it.status === "done" && !!it.decision;
    if (done && !S.revealed.has(id)) {
      if (!S.queued.has(id)) { S.queue.push(id); S.queued.add(id); added++; }
    } else if (!done && S.revealed.has(id)) {
      S.revealed.delete(id); delete S.laneOf[id];
    } else if (done) {
      S.laneOf[id] = it.decision.lane;
    }
  }
  if (S.queue.length) {
    S.queue = S.queue.filter((id) => {
      const it = S.state.items[id];
      const ok = !!(it && it.status === "done" && it.decision);
      if (!ok) S.queued.delete(id);
      return ok;
    });
  }
  if (added && S.queue.length) {
    // A long queue lands in about 2.6 seconds; a short one at a readable pace.
    const iv = Math.min(170, 2600 / S.queue.length);
    S.revealInterval = idle ? iv : Math.min(S.revealInterval, iv);
  }
  scheduleRender();
  renderBanner();
  renderConn();
  pumpReveal();
}

function resetReveal() {
  S.revealed.clear(); S.queue = []; S.queued.clear(); S.laneOf = {}; S.fresh.clear();
  if (S.revealRaf) cancelAnimationFrame(S.revealRaf);
  S.revealRaf = 0; S.revealAcc = 0; S.revealInterval = 170;
}

function pumpReveal() {
  if (!S.queue.length || S.revealRaf) return;
  if (reducedMotion()) { revealSome(S.queue.length); renderAll(); return; }
  S.revealLast = performance.now();
  S.revealAcc = S.revealInterval;  // the first card lands on the next frame
  S.revealRaf = requestAnimationFrame(revealFrame);
}

function revealFrame(now) {
  S.revealRaf = 0;
  S.revealAcc = Math.min(S.revealAcc + Math.max(0, now - S.revealLast), S.revealInterval * 4 + 40);
  S.revealLast = now;
  const n = Math.floor(S.revealAcc / S.revealInterval);
  if (n > 0) {
    S.revealAcc -= n * S.revealInterval;
    if (revealSome(n)) renderAll();
  }
  if (S.queue.length) S.revealRaf = requestAnimationFrame(revealFrame);
  else { S.revealAcc = 0; S.revealInterval = 170; }
}

function revealSome(n) {
  let any = false;
  while (n > 0 && S.queue.length) {
    const id = S.queue.shift();
    S.queued.delete(id);
    const it = S.state.items[id];
    if (!it || it.status !== "done" || !it.decision) continue;
    S.revealed.add(id); S.laneOf[id] = it.decision.lane; S.fresh.add(id);
    any = true; n--;
  }
  return any;
}

function scheduleRender() {
  if (!S.renderRaf) S.renderRaf = requestAnimationFrame(() => { S.renderRaf = 0; renderAll(); });
}

function renderAll() {
  if (S.renderRaf) { cancelAnimationFrame(S.renderRaf); S.renderRaf = 0; }
  if (!S.state) return;
  renderRouteBtn(); renderStats(); renderInbox(); renderBoard();
  if (S.drawer === "email") renderEmailDrawer(false);
  if (S.drawer === "settings") updateSettings();
}

/* ---------------------------------------------------------------- top */
function renderRouteBtn() {
  const w = S.state.worker, b = $("#routeBtn");
  const busy = w.state === "running" || w.state === "waiting" || w.queue_length > 0;
  if (S.dom.routeBusy === busy) return;
  S.dom.routeBusy = busy;
  b.innerHTML = busy ? `${ic("stop")}<span class="label">Stop</span>` : `${ic("play", "play")}<span class="label">Route inbox</span>`;
  b.className = busy ? "btn" : "btn primary";
  b.dataset.busy = busy ? "1" : "";
}

async function onRoute() {
  if (Date.now() < S.routeLock) return;  // a double-click must not start and then stop
  S.routeLock = Date.now() + 800;
  const b = $("#routeBtn");
  try {
    if (b.dataset.busy) { const st = await api("/api/stop", {}); applyState(st.state); toast("Stopped. Everything routed so far is saved."); return; }
    const ids = S.state.order.filter((id) => S.state.items[id] && ["idle", "error"].includes(S.state.items[id].status));
    if (!ids.length) { toast("Everything is routed. Press Reset to replay the demo."); return; }
    const r = await api("/api/run", { ids, use_cache: S.useCache });
    applyState(r.state);
    if (r.cached && !r.queued) toast(`Replaying ${r.cached} saved Jev results`);
    else if (r.queued) toast(`Sending ${r.queued} email${r.queued === 1 ? "" : "s"} to Jev${r.cached ? `, replaying ${r.cached} saved` : ""}`);
  } catch (e) { toast(e.message); }
}

/* ---------------------------------------------------------------- stats */
function visibleDone() {
  return S.state.order.filter((id) => S.revealed.has(id) && S.state.items[id] && S.state.items[id].decision);
}

function renderStats() {
  const ids = visibleDone(), st = S.state, total = st.order.length;
  let auto = 0, review = 0, match = 0, graded = 0, cost = 0, listPrice = 0, reported = false;
  const lat = [];
  for (const id of ids) {
    const it = st.items[id], d = it.decision;
    if (d.lane === "review") review++; else auto++;
    if (d.matches_expected != null) { graded++; if (d.matches_expected) match++; }
    if (it.jev) {
      if (it.jev.latency_ms) lat.push(it.jev.latency_ms);
      cost += it.jev.cost_usd || 0; listPrice += it.jev.list_price_usd || 0;
      if (!it.jev.cost_is_estimate) reported = true;
    }
  }
  lat.sort((a, b) => a - b);
  const med = lat.length ? lat[Math.floor(lat.length / 2)] : null;
  let costSub = "at $0.042 per 1M input tokens";
  if (ids.length && reported && cost === 0) costSub = `free promo · list price ${money(listPrice)}`;
  else if (ids.length && reported) costSub = "reported by AI Gateway";
  else if (ids.length) costSub = "estimated at list price";
  const tiles = [
    { label: "Routed", value: `${ids.length}<small> / ${total}</small>`, sub: ids.length ? `${ids.length} sorted by Jev` : "Nothing routed yet" },
    { label: "Auto-routed", value: ids.length ? pct(auto / ids.length) : "n/a", sub: ids.length ? `${review} sent to a person` : "Low-confidence mail goes to review" },
    { label: "Median Jev response", value: med == null ? "n/a" : `${Math.round(med)}<small> ms</small>`, sub: `${S.boot.questions.length} questions per email, one call` },
    { label: "Jev cost so far", value: ids.length ? money(reported && cost === 0 ? 0 : (cost || listPrice)) : "$0.00", sub: costSub },
    { label: "Answer key", value: graded ? `${match}<small> / ${graded}</small>` : "n/a", sub: graded ? "matches the expected route" : "Scored against the demo key", hidden: !S.showKey },
  ];
  const html = tiles.map((t) => `<div class="tile${t.hidden ? " hidden" : ""}"><div class="label">${t.label}</div><div class="value">${t.value}</div><div class="sub">${esc(t.sub)}</div></div>`).join("");
  if (html !== S.dom.statsHtml) { $("#stats").innerHTML = html; S.dom.statsHtml = html; }
}

/* ---------------------------------------------------------------- inbox */
function rowState(id) {
  const it = S.state.items[id];
  if (!it) return "idle";
  if (it.status === "done" && S.revealed.has(id) && it.decision) return "shown";
  if (it.status === "running" || it.status === "done") return "asking";
  return it.status;  // idle, queued, error
}

function statusIcon(id, state) {
  const it = S.state.items[id];
  if (state === "shown") return marker(it.decision.lane);
  if (state === "asking") return `<span class="spin" aria-label="Routing"></span>`;
  if (state === "queued") return `<span class="st-queued" aria-label="Queued"></span>`;
  if (state === "error") return `<span class="st-err" aria-label="Error">${ic("alert", "sm")}</span>`;
  return `<span class="st-idle" aria-label="Not routed"></span>`;
}

function rowSig(id) {
  const e = S.emails[id], it = S.state.items[id] || {}, state = rowState(id);
  const d = state === "shown" ? it.decision : null;
  return [state, d ? d.lane + d.lane_name + (d.priority || "") + (d.customer ? d.customer.name : "") : "",
    state === "error" ? (it.error && it.error.message) || "" : "", (e.attachments || []).length].join("|");
}

function rowInner(id) {
  const e = S.emails[id], it = S.state.items[id] || {}, state = rowState(id);
  const d = state === "shown" ? it.decision : null;
  const att = (e.attachments || []).length;
  let dest;
  if (d) dest = `<span class="dest">${ic("arrow", "sm")}${marker(d.lane)}<span class="lname">${esc(d.lane_name)}</span>${d.priority ? `<span class="prio ${esc(d.priority)}">${esc(d.priority)}</span>` : ""}</span>`;
  else if (state === "error") dest = `<span class="dest err"><span class="lname">${esc((it.error && it.error.message) || "Error")}</span></span>`;
  else if (state === "queued") dest = `<span class="snip">Queued for Jev</span>`;
  else if (state === "asking") dest = `<span class="snip">Asking Jev</span>`;
  else dest = `<span class="snip">${esc((e.body || "").replace(/\s+/g, " ").slice(0, 110))}</span>`;
  return `<span class="st">${statusIcon(id, state)}</span>
    <span class="rmain">
      <span class="line1"><span class="who">${esc(e.from_name || "Unknown sender")}</span><span class="org">${esc(orgOf(e, d))}</span><span class="time">${att ? `<span class="clip" title="${plural(att, "attachment")}">${ic("clip", "sm")}${att}</span>` : ""}${esc(e.received || "")}</span></span>
      <span class="subj">${esc(e.subject || "(no subject)")}</span>
      ${dest}
    </span>`;
}

function renderInbox() {
  const st = S.state, list = $("#inboxList");
  const count = String(st.order.length);
  if ($("#inboxCount").textContent !== count) $("#inboxCount").textContent = count;
  let ref = list.firstElementChild;
  for (const id of st.order) {
    const e = S.emails[id];
    if (!e) continue;
    let r = S.dom.rows.get(id);
    if (!r) {
      const el = document.createElement("div");
      el.className = "row"; el.dataset.id = id; el.setAttribute("role", "button"); el.tabIndex = 0;
      el.setAttribute("aria-label", e.subject || "No subject");
      r = { el, sig: null }; S.dom.rows.set(id, r);
    }
    const sig = rowSig(id);
    if (r.sig !== sig) {
      r.el.innerHTML = rowInner(id);
      r.el.classList.toggle("done", rowState(id) === "shown");
      r.sig = sig;
    }
    r.el.classList.toggle("sel", S.selected === id);
    if (r.el !== ref) list.insertBefore(r.el, ref);
    else ref = ref.nextElementSibling;
  }
  while (ref) { const next = ref.nextElementSibling; if (!st.order.includes(ref.dataset.id)) { S.dom.rows.delete(ref.dataset.id); ref.remove(); } ref = next; }
}

/* ---------------------------------------------------------------- board */
function badgeHtml(f) {
  const icon = { restricted: "lock", serious: "zap", warning: "alert" }[f.tone];
  return `<span class="badge ${esc(f.tone)}">${icon ? ic(icon, "sm") : ""}${esc(f.label)}</span>`;
}

function customerBadge(d) {
  if (d.customer) return `<span class="badge tier">${esc(d.customer.tier)}-tier customer</span>`;
  if (d.lane !== "filtered") return `<span class="badge prospect">${ic("spark", "sm")}New prospect</span>`;
  return "";
}

function cardBadges(d) {
  const f = d.flags.filter((x) => x.id !== "volume");
  const vol = d.flags.find((x) => x.id === "volume");
  const toned = ["restricted", "serious", "warning"];
  const list = toned.flatMap((tone) => f.filter((x) => x.tone === tone)).map(badgeHtml);
  const cb = customerBadge(d);
  if (cb) list.push(cb);
  if (d.lane === "itar" && d.is_rfq) list.push(`<span class="badge">Likely ${esc(d.process_guess.label)}</span>`);
  else if (vol) list.push(badgeHtml(vol));
  list.push(...f.filter((x) => !toned.includes(x.tone)).map(badgeHtml));
  return list.slice(0, 3).join("");
}

function meterHtml(m, lane) {
  if (!m || m.value == null) return "";
  const ink = lane === "itar";
  return `<div class="cm" title="${esc(m.label)} ${pct(m.value)}; bar at ${pct(m.threshold)}"><div class="meter${ink ? " ink" : ""}"><div class="fill" style="width:${Math.max(2, m.value * 100)}%"></div><div class="tick" style="left:calc(${m.threshold * 100}% - 1px)"></div></div><span class="mval">${pct(m.value)}</span></div>`;
}

function cardSig(id) {
  const e = S.emails[id], d = S.state.items[id].decision;
  return [d.lane, d.priority, d.flags.map((f) => f.id + ":" + f.label).join(","), d.customer ? d.customer.tier + d.customer.name : "",
    d.meter ? `${d.meter.value}/${d.meter.threshold}/${d.meter.label}` : "", d.lane === "itar" && d.is_rfq ? d.process_guess.label : "",
    S.showKey && d.matches_expected != null ? `${d.matches_expected}${d.expected_lane}` : "", (e.attachments || []).length].join("|");
}

function cardInner(id) {
  const e = S.emails[id], d = S.state.items[id].decision;
  const att = (e.attachments || []).length;
  const key = S.showKey && d.matches_expected != null
    ? `<span class="key-mark ${d.matches_expected ? "ok" : "bad"}" title="Answer key: ${esc(S.lanes[d.expected_lane] ? S.lanes[d.expected_lane].name : d.expected_lane)}">${ic(d.matches_expected ? "check" : "x", "sm")}</span>` : "";
  return `${key}<div class="csubj">${esc(e.subject || "(no subject)")}</div>
    <div class="cmeta">${d.priority ? `<span class="prio ${esc(d.priority)}">${esc(d.priority)}</span>` : ""}<span class="o">${esc(orgOf(e, d))}</span>${att ? `<span class="clip" title="${plural(att, "attachment")}">${ic("clip", "sm")}${att}</span>` : ""}</div>
    <div class="cfoot"><div class="badges">${cardBadges(d)}</div>${meterHtml(d.meter, d.lane)}</div>`;
}

function laneShell(lane) {
  const icon = LANE_ICON[lane.id] ? ic(LANE_ICON[lane.id], "sm") : "";
  return `<div class="lane${lane.id === "itar" ? " itar" : ""}" data-lane="${esc(lane.id)}">
    <div class="lane-head">
      <div class="lane-title">${marker(lane.id)}${icon}<span class="nm">${esc(lane.name)}</span><span class="n">0</span></div>
      <div class="lane-owner">${esc(lane.owner)}${lane.role ? " · " + esc(lane.role) : ""}</div>
    </div>
    <div class="empty">No emails yet</div>
    <div class="cards" aria-label="${esc(lane.name)}"></div>
  </div>`;
}

function buildBoard() {
  const est = S.boot.lanes.filter((l) => l.group === "estimating");
  const other = S.boot.lanes.filter((l) => l.group !== "estimating");
  const n = S.boot.questions.length, F = S.boot.features || {};
  const ocrLine = F.ocr || F.rfq_details ? " Scans, faxes, and photos have no text layer, so they are read with OCR first." : "";
  const csvLine = F.rfq_details ? " The details of every RFQ go into one CSV." : "";
  $("#board").innerHTML = `<div class="how" id="how">
      <div class="step"><div class="num">1</div><h4>One Jev call per email</h4><p>The email and the text of its attachments (drawing notes, title blocks, RFQ forms) go to Jev with ${n} questions at once: what it is, which estimator, ITAR or CUI, urgency, and what is missing.${ocrLine}</p></div>
      <div class="step"><div class="num">2</div><h4>Typed answers with probabilities</h4><p>Jev returns choices, yes/no probabilities, and scores in a few hundred milliseconds. No text to parse, nothing to hallucinate.</p></div>
      <div class="step"><div class="num">3</div><h4>Your rules route it</h4><p>Code checks ITAR first, sends low-confidence mail to a person, sets priority and quote dates, and drafts the reply from a template.${csvLine}</p></div>
    </div>
    <div class="group est"><div class="group-head"><h3>Estimating</h3><span>Jev picks the estimator. Export control is checked first.</span></div>
      <div class="lanes four">${est.map(laneShell).join("")}</div></div>
    <div class="group other"><div class="group-head"><h3>Everything else</h3><span>Orders, review, and noise.</span></div>
      <div class="lanes three">${other.map(laneShell).join("")}</div></div>`;
  S.dom.lanes = {}; S.dom.cards.clear();
  for (const el of document.querySelectorAll("#board [data-lane]")) {
    S.dom.lanes[el.dataset.lane] = { el, list: el.querySelector(".cards"), count: el.querySelector(".n"), empty: el.querySelector(".empty"), n: -1 };
  }
}

/* Incremental: cards are keyed by email id, and only a card whose signature changed is rebuilt.
   Lane lists are never replaced, so their scroll positions survive polls and reveals. */
function renderBoard() {
  const how = $("#how");
  if (how) how.hidden = S.revealed.size > 0;
  const perLane = {};
  for (const id in S.dom.lanes) perLane[id] = [];
  for (const id of S.state.order) {
    if (!S.revealed.has(id)) continue;
    const it = S.state.items[id], d = it && it.decision;
    if (d && perLane[d.lane] && S.emails[id]) perLane[d.lane].push(id);
  }
  for (const [id, c] of S.dom.cards) {
    const it = S.state.items[id];
    if (!S.revealed.has(id) || !it || !it.decision || !S.emails[id]) { c.el.remove(); S.dom.cards.delete(id); }
  }
  for (const laneId in S.dom.lanes) {
    const L = S.dom.lanes[laneId], ids = perLane[laneId];
    if (L.n !== ids.length) { L.count.textContent = ids.length; L.empty.hidden = ids.length > 0; L.n = ids.length; }
    let ref = L.list.firstElementChild;
    for (const id of ids) {
      let c = S.dom.cards.get(id);
      if (!c) {
        const el = document.createElement("div");
        el.className = "card"; el.dataset.id = id; el.setAttribute("role", "button"); el.tabIndex = 0;
        el.setAttribute("aria-label", S.emails[id].subject || "No subject");
        c = { el, sig: null, lane: null }; S.dom.cards.set(id, c);
      }
      const sig = cardSig(id);
      if (c.sig !== sig) { c.el.innerHTML = cardInner(id); c.sig = sig; }
      if (S.fresh.has(id)) { S.fresh.delete(id); c.el.classList.remove("moved"); c.el.classList.add("fresh"); }
      else if (c.lane && c.lane !== laneId) { c.el.classList.remove("fresh"); c.el.classList.add("moved"); }
      c.lane = laneId;
      c.el.classList.toggle("sel", S.selected === id);
      if (c.el !== ref) L.list.insertBefore(c.el, ref);
      else ref = ref.nextElementSibling;
    }
  }
}

/* ---------------------------------------------------------------- banner */
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, "0")}`; }

function renderBanner() {
  const b = $("#banner"), w = S.state ? S.state.worker : null, j = S.boot ? S.boot.jev : null;
  let cls = "", html = "";
  if (S.offline) {
    cls = "bad"; html = `<span class="bicon">${ic("plug", "lg")}</span><div class="bmain"><div class="btitle">The demo server stopped responding</div><div class="bbody">Check that the black command window is still open, or double-click run_demo.bat again. A cloud host may be restarting; the page reconnects on its own.</div></div>`;
  } else if (j && !j.configured) {
    cls = "warn"; html = `<span class="bicon">${ic("alert", "lg")}</span><div class="bmain"><div class="btitle">No Jev API key found</div><div class="bbody">Add <code>AI_GATEWAY_API_KEY=vck_...</code> to <code>Jev_Test\\.env</code> and restart the demo. Saved results can still be replayed.</div></div>`;
  } else if (w && w.state === "waiting" && (w.wait_reason === "rate_limit" || w.wait_reason === "pace")) {
    const left = w.resume_at ? w.resume_at - (Date.now() + S.clockOffset) / 1000 : 0;
    const remaining = S.state.order.filter((id) => S.state.items[id] && ["queued", "running"].includes(S.state.items[id].status)).length;
    cls = "warn"; html = `<span class="bicon">${ic("clock", "lg")}</span><div class="bmain"><div class="btitle">AI Gateway free tier: next Jev call in <span class="countdown" id="cd">${fmtClock(left)}</span> · ${remaining} left in the queue</div><div class="bbody">The free tier only allows a handful of Jev calls every few minutes, so the demo paces itself and keeps going on its own. Buying any amount of AI Gateway credits removes the limit. Every result is saved, so later runs replay instantly.</div></div><button class="btn small" id="bannerStop">${ic("stop", "sm")}Stop</button>`;
  } else if (w && w.state === "stopped" && w.last_error) {
    const e = w.last_error;
    cls = "bad"; html = `<span class="bicon">${ic("alert", "lg")}</span><div class="bmain"><div class="btitle">${esc(e.message)}</div><div class="bbody">${esc(e.hint || "")}</div></div><button class="btn small" id="bannerRetry">${ic("refresh", "sm")}Try again</button>`;
  } else if (w && w.state === "waiting" && w.wait_reason === "retry") {
    cls = "info"; html = `<span class="bicon">${ic("refresh", "lg")}</span><div class="bmain"><div class="btitle">${esc(w.message)}</div></div>`;
  }
  b.className = "banner" + (html ? " show " + cls : "");
  const structure = html.replace(/<span class="countdown" id="cd">[^<]*<\/span>/, "");
  if (b.dataset.html === structure && html) {
    const cd = $("#cd"), m = html.match(/id="cd">([^<]*)</);
    if (cd && m && cd.textContent !== m[1]) cd.textContent = m[1];
    return;
  }
  if (b.dataset.html === structure) return;
  b.innerHTML = html; b.dataset.html = structure;
  const stop = $("#bannerStop"); if (stop) stop.onclick = async () => { try { const st = await api("/api/stop", {}); applyState(st.state); } catch (e) { toast(e.message); } };
  const retry = $("#bannerRetry"); if (retry) retry.onclick = onRoute;
}
setInterval(() => { if (S.state && S.state.worker.state === "waiting") renderBanner(); }, 1000);

/* ---------------------------------------------------------------- drawer */
function markSelected(prev, next) {
  for (const id of [prev, next]) {
    if (!id) continue;
    const c = S.dom.cards.get(id); if (c) c.el.classList.toggle("sel", S.selected === id);
    const r = S.dom.rows.get(id); if (r) r.el.classList.toggle("sel", S.selected === id);
  }
}

function select(id) {
  const prev = S.selected;
  S.selected = id;
  markSelected(prev, id);
  // Opening the drawer asks the server again (other files may have been read since); the record
  // already here stays on screen until the answer comes back.
  const ent = RD.map.get(id);
  if (ent && ent.pending == null) ent.key = null;
  if (RD.openFor !== id) { RD.open.clear(); RD.openFor = id; }
  openDrawer("email");
}

function openDrawer(mode) {
  if (mode !== "email" && S.selected) { const prev = S.selected; S.selected = null; markSelected(prev, null); }
  const drawer = $("#drawer"), opener = document.activeElement;
  const wasOpen = drawer.classList.contains("show");
  if (!wasOpen) S.drawerReturn = opener && opener !== document.body && !drawer.contains(opener) ? opener : null;
  S.drawer = mode;
  drawer.classList.add("show"); drawer.setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("show");
  if (mode === "email") renderEmailDrawer(true); else renderSettings();
  // Opened from the keyboard: move focus into the drawer, so Tab does not wander over the board behind the scrim.
  if (!wasOpen && opener && opener !== document.body && opener.matches(":focus-visible")) { const c = $("#closeDrawer"); if (c) c.focus({ preventScroll: true }); }
}

function closeOverlays() {
  if (!$("#viewer").hidden) return closeViewer();
  if (pasteOpen()) return closePaste();
  closeDrawer();
}

function closeDrawer() {
  const prev = S.selected, drawer = $("#drawer");
  const hadFocus = drawer.contains(document.activeElement);
  S.drawer = null; S.selected = null; S.drawerVersion = null;
  markSelected(prev, null);
  drawer.classList.remove("show"); drawer.setAttribute("aria-hidden", "true");
  if (!pasteOpen()) $("#scrim").classList.remove("show");
  // The closed drawer is hidden, so focus inside it would fall back to the top of the page: return it to the opener.
  if (hadFocus && !pasteOpen()) {
    const card = prev && S.dom.cards.get(prev), row = prev && S.dom.rows.get(prev), opener = S.drawerReturn;
    // Opened from a card or an inbox row: go back to the one for the email shown last.
    const same = opener && opener.dataset && opener.dataset.id ? (opener.classList.contains("row") ? row : card) : null;
    const canFocus = (el) => el && el.isConnected && el.getClientRects().length && getComputedStyle(el).visibility !== "hidden";
    const back = [same && same.el, opener, card && card.el, row && row.el].find(canFocus);
    if (back) back.focus({ preventScroll: true });
  }
  S.drawerReturn = null;
}

function optionLabel(qname, key) {
  if (qname === "email_type") return S.boot.email_type_labels[key] || key;
  if (qname === "volume") return S.boot.volume_labels[key] || key;
  if (qname === "process") return (S.lanes[key] && S.lanes[key].name) || (key === "mixed_or_unclear" ? "Mixed / unclear" : key);
  return key;
}

function answerHtml(q, a, th) {
  if (!a) return "";
  let head = "", body = "", foot = "";
  if (a.type === "choice") {
    const opts = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]);
    head = `${esc(optionLabel(q.name, a.choice))} · confidence ${pct(a.confidence)}`;
    body = opts.map(([k, p]) => `<div class="opt${k === a.choice ? " win" : ""}"><span class="on" title="${esc(optionLabel(q.name, k))}">${k === a.choice ? ic("check", "sm") + " " : ""}${esc(optionLabel(q.name, k))}</span><div class="bar"><div class="fill" style="width:${p * 100}%"></div></div><span class="pv">${pct(p)}</span></div>`).join("");
    const bar = q.name === "email_type" ? th.email_type_confidence : q.name === "process" ? th.process_confidence : null;
    foot = bar != null ? `Auto-routes when confidence is at least ${pct(bar)}.${a.confidence_estimated ? " Confidence computed from the probabilities." : ""}` : "";
  } else if (a.type === "noul") {
    const key = NOUL_BAR[q.name], bar = key ? th[key] : null;
    head = `${pct(a.p)} yes`;
    body = `<div class="opt win"><span class="on">Yes</span><div class="bar"><div class="fill" style="width:${a.p * 100}%"></div>${bar != null ? `<div class="tick" style="left:calc(${bar * 100}% - 1px)"></div>` : ""}</div><span class="pv">${pct(a.p)}</span></div>`;
    if (bar != null) foot = q.name === "export_controlled" ? `Restricted queue at ${pct(bar)} or above (the tick).` : `Counts as yes at ${pct(bar)} or above (the tick).`;
  } else if (a.type === "score") {
    const levels = Object.keys(a.probabilities).map(Number).sort((x, y) => x - y);
    const top = levels.reduce((m, l) => (a.probabilities[l] > a.probabilities[m] ? l : m), levels[0]);
    head = `${a.score.toFixed(2)} of ${levels.length - 1} · confidence ${pct(a.confidence)}`;
    body = levels.map((l) => `<div class="opt${l === top ? " win" : ""}"><span class="on" title="${esc((a.legend || {})[l] || "")}">${l}. ${esc(URGENCY_LEVELS[l] || "Level " + l)}</span><div class="bar"><div class="fill" style="width:${a.probabilities[l] * 100}%"></div></div><span class="pv">${pct(a.probabilities[l])}</span></div>`).join("");
    foot = `Rush flag at ${th.rush_score} or above. The score is the probability-weighted level.`;
  }
  return `<div class="q"><div class="q-head"><span class="ql">${esc(q.label)}</span><span class="qt">${esc(a.type)}</span><span class="qa">${head}</span></div>${body}${foot ? `<div class="q-foot">${foot}</div>` : ""}</div>`;
}

function traceIcon(o) { return { pass: "check", stop: "arrow", warn: "alert", info: "info", done: "check", review: "eye" }[o] || "info"; }

/* ---------------------------------------------------------------- attachment tiles */
function fileType(att) {
  if (att.media === "pdf") return "pdf";
  if (att.media === "step") return "step";
  if (att.media === "png" || att.media === "jpg") return "image";
  const ext = (att.name || "").toLowerCase().split(".").pop();
  if (ext === "pdf") return "pdf";
  if (["step", "stp"].includes(ext)) return "step";
  if (["png", "jpg", "jpeg", "gif", "webp"].includes(ext)) return "image";
  return "generic";
}

function metaLine(att, long) {
  const parts = [];
  if (att.kind === "upload") parts.push(att.media === "pdf" ? "PDF" : att.media === "png" ? "PNG image" : "JPG image");
  else if (att.kind === "name_only") parts.push("Name only");
  else if (att.kind === "model") parts.push(long ? `3D model, STEP ${(att.model && att.model.schema) || "AP214"}` : "3D model");
  else parts.push(att.label || "File");
  if (att.size) parts.push(fmtBytes(att.size));
  const image = fileType(att) === "image";
  if (att.pages && !image) parts.push(plural(att.pages, "page"));
  if (image && att.width && att.height) parts.push(`${att.width} × ${att.height}`);
  return parts.join(" · ");
}

function hasFile(att) { return !!att.url && att.available !== false; }

function previewHtml(att, opts) {
  const t = fileType(att);
  if (opts.state === "uploading" || opts.state === "reading") {
    const p = Math.round((opts.progress || 0) * 100);
    const label = opts.state === "reading" ? (att.media === "pdf" || t === "pdf" ? "Reading the text" : "Finishing") : `Uploading ${p}%`;
    return `<span class="fprev center busy">${opts.localUrl ? `<img src="${esc(opts.localUrl)}" alt="">` : ""}<span class="spin"></span><span>${label}</span><span class="fprog"><i style="width:${opts.state === "reading" ? 100 : p}%"></i></span></span>`;
  }
  if (opts.state === "error") return `<span class="fprev center err">${ic("alert")}<span>${esc(opts.error || "Upload failed")}</span></span>`;
  if (att.kind === "name_only") return `<span class="fprev center none">${ic("file")}<span>Name only, no file</span></span>`;
  if (att.kind === "model") {
    return `<span class="fprev model">${att.thumb ? `<img src="${esc(att.thumb)}" alt="" loading="lazy">` : ""}<span class="f3d">3D</span><span class="fschema">STEP ${esc((att.model && att.model.schema) || "AP214")}</span></span>`;
  }
  if (att.thumb) return `<span class="fprev page"><img src="${esc(att.thumb)}" alt="" loading="lazy"></span>`;
  if (att.kind === "upload" && t === "image") {
    if (!hasFile(att)) return `<span class="fprev center">${ic("image")}<span>No longer in memory</span></span>`;
    return `<span class="fprev image"><img src="${esc(att.url)}" alt="" loading="lazy"></span>`;
  }
  if (att.kind === "upload" && t === "pdf") {
    const pages = att.pages ? `<span class="fpages">${plural(att.pages, "page")}</span>` : "";
    if (att.preview) return `<span class="fprev page"><span class="fpaper"><span class="fpaper-in">${esc(att.preview)}</span></span>${pages}</span>`;
    return `<span class="fprev center pdf">${ic("file")}<span>${att.text_error ? "Text could not be read" : "No text layer"}</span>${pages}</span>`;
  }
  return `<span class="fprev center">${ic(TYPE_ICON[t])}</span>`;
}

/* One tile, as a button that opens the viewer. opts: idx (viewer index, or null when not openable),
   key, removable, marked, state (uploading|reading|error), progress, error, localUrl. */
function tileHtml(att, opts) {
  const t = fileType(att), meta = opts.state === "uploading" ? "Uploading" : opts.state === "reading" ? "Processing" : opts.state === "error" ? "Not attached" : metaLine(att);
  const legendKey = LEGENDS[att.legend] ? att.legend : null;
  const legendLabel = legendKey ? LEGENDS[legendKey] : opts.marked ? "Export marking" : "";
  const legend = legendLabel ? `<span class="badge restricted flegend" title="${legendKey ? `${legendLabel} legend on this file` : "Export-control marking in this file"}">${ic("lock", "sm")}${esc(legendLabel)}</span>` : "";
  const mark = opts.marked ? `<span class="fmark">${ic("lock", "sm")}Marking found here</span>` : "";
  // A scan, photo, or screenshot has no text layer: its text came from OCR.
  const ocrConf = att.scanned ? ocrInfo(att.text_from) : null;
  const ocr = att.scanned && !opts.state ? `<span class="focr" title="${esc(`No text layer: the text was read with OCR${ocrConf && ocrConf.conf != null ? `, ${ocrConf.conf}% confidence` : ""}`)}">OCR</span>` : "";
  const openable = opts.idx != null && !opts.state;
  const cls = `ftile${att.kind === "name_only" ? " nofile" : ""}${opts.state === "error" ? " err" : ""}`;
  const aria = `${openable ? "Open " : ""}${att.name}, ${meta}${legendLabel ? `, ${legendLabel}` : ""}${ocr ? ", text read with OCR" : ""}${opts.marked ? ", export-control marking found in this file" : ""}`;
  const inner = `${previewHtml(att, opts).replace(/<\/span>$/, `${mark}</span>`)}${ocr}${legend}
      <span class="ffoot"><span class="ficon ${t}">${ic(TYPE_ICON[t])}</span><span class="ftext"><span class="fname">${esc(att.name)}</span><span class="fmeta">${esc(meta)}</span></span></span>`;
  const tile = openable
    ? `<button type="button" class="${cls}" data-att="${opts.idx}" title="${esc(att.name)}" aria-label="${esc(aria)}">${inner}</button>`
    : `<div class="${cls}" role="group" title="${esc(att.name)}" aria-label="${esc(aria)}"${opts.state === "uploading" || opts.state === "reading" ? ' aria-busy="true"' : ""}>${inner}</div>`;
  const x = opts.removable ? `<button type="button" class="ftile-x" data-remove="${esc(opts.key)}" aria-label="${opts.state === "uploading" ? "Cancel upload of" : "Remove"} ${esc(att.name)}" title="Remove">${ic("x", "sm")}</button>` : "";
  return `<div class="ftile-wrap${opts.marked ? " marked" : ""}${opts.removable ? " removable" : ""}" data-key="${esc(opts.key)}">${tile}${x}</div>`;
}

function attachmentsHtml(e, d) {
  const atts = e.attachments || [];
  if (!atts.length) return `<div class="note">No attachments</div>`;
  const marked = new Set(d ? d.export_marked || [] : []);
  const withFile = atts.filter((a) => a.kind !== "name_only").length;
  const tiles = atts.map((a, i) => tileHtml(a, { idx: i, key: "a" + i, marked: marked.has(a.name) })).join("");
  let hint = withFile ? "Jev reads the text of each file" : "Jev sees the file names only";
  if (atts.some((a) => a.scanned)) hint += ", read with OCR for scans and photos";
  if (withFile && withFile < atts.length) hint += "; for a name-only file, just the name";
  let note = "";
  if (d && marked.size) {
    const names = [...marked].map((n) => `<b>${esc(n)}</b>`).join(", ");
    const inText = EXPORT_RE.test(`${e.subject || ""}\n${e.body || ""}`);
    const tail = inText ? "" : d.lane === "itar"
      ? " The email text never mentions it: Jev caught it in the attachment and sent the email to the restricted queue."
      : " The email text itself does not mention it.";
    note = `<div class="mark-note">${ic("lock", "sm")}<span>Export-control marking found in ${names}.${tail}</span></div>`;
  }
  return `<div class="att-head"><span class="att-count">${ic("clip", "sm")}${plural(atts.length, "attachment")}</span><span class="att-hint">${hint}</span></div>
    <div class="ftiles">${tiles}</div>${note}`;
}

function renderEmailDrawer(force) {
  const id = S.selected, e = S.emails[id];

  ensureRfq(id);  // fetches only when the decision or the files changed; the section updates itself
  // The files are part of the version: the server reads them in the background (OCR can take a few
  // seconds), and each tile's label and OCR badge change when it has.
  const files = (e.attachments || []).map((a) => [a.label, a.text_from, a.legend, a.thumb].join("|"));
  const version = JSON.stringify([id, it.status, shown, it.decision && it.decision.lane, it.decision && it.decision.export_marked, it.jev && it.jev.saved_at, S.state.thresholds, S.showKey, it.error && it.error.message, files]);

  let top = "", after = "";
  if (d) {

    const keyLine = S.showKey && d.expected_lane ? `<div class="note">${d.matches_expected ? ic("check", "sm") + " Matches" : ic("x", "sm") + " Differs from"} the answer key: ${esc(S.lanes[d.expected_lane] ? S.lanes[d.expected_lane].name : d.expected_lane)}. ${esc((e.expected && e.expected.note) || "")}</div>` : "";
    top = `<div class="sec"><div class="sec-title">Routing decision</div>

    const act = d.action || {};

      <div class="action-title">${esc(act.title || "")}</div>
      ${act.draft ? `<textarea class="draft" id="draftText" readonly>${esc(act.draft)}</textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn small" id="copyDraft">${ic("copy", "sm")}Copy draft</button><span class="note draft-to" style="margin:0">To: ${esc(act.to || "")}. Written from a template by code; Jev makes decisions, it does not write text.</span></div>` : ""}
    </div>`;
    after += `<div class="sec"><div class="sec-title">What Jev answered<span class="aside">${S.boot.questions.length} questions, one call</span></div>
      ${S.boot.questions.map((q) => answerHtml(q, it.jev && it.jev.answers[q.name], th)).join("")}</div>`;
  } else if (it.status === "error") {

    top = `<div class="sec"><div class="status-box"><span class="spin"></span>${it.status === "queued" ? "Waiting in line for Jev" : "Asking Jev"}</div></div>`;
  } else {
    top = `<div class="sec"><div class="status-box">${ic("info")}Not routed yet.<span class="spacer"></span><button class="btn small primary" id="routeOne">${ic("play", "sm play")}Route this email</button></div></div>`;
  }
  const meta = d && it.jev ? `<div class="sec"><div class="sec-title">Call details</div><dl class="kv">
      <dt>Model</dt><dd>${esc(it.jev.model || "")}</dd>

  rdHint();
  $("#closeDrawer").onclick = closeOverlays;
  const ta = $("#draftText");
  if (ta) { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 4) + "px"; }
  if (keepScroll) $("#drawer .dbody").scrollTop = keepScroll;
  const refocus = focusAtt !== undefined ? $(`#drawer [data-att="${focusAtt}"]`) : focusId ? document.getElementById(focusId) : null;
  if (refocus && $("#drawer").contains(refocus)) refocus.focus({ preventScroll: true });
  else if (inDrawer) { const c = $("#closeDrawer"); if (c) c.focus({ preventScroll: true }); }
  const copy = $("#copyDraft");
  if (copy) copy.onclick = async () => { try { await navigator.clipboard.writeText($("#draftText").value); toast("Draft copied"); } catch (err) { $("#draftText").select(); document.execCommand("copy"); toast("Draft copied"); } };
  const rerun = $("#rerun");
  if (rerun) rerun.onclick = async () => { rerun.disabled = true; try { const r = await api("/api/run", { ids: [id], use_cache: false, front: true }); applyState(r.state); } catch (err) { toast(err.message); } renderEmailDrawer(true); };
  const one = $("#routeOne");
  if (one) one.onclick = async () => { one.disabled = true; try { const r = await api("/api/run", { ids: [id], use_cache: S.useCache, front: true }); applyState(r.state); } catch (err) { toast(err.message); } renderEmailDrawer(true); };
}

/* ---------------------------------------------------------------- RFQ details */
/* What rfq_details.py pulled out of one RFQ. Every value comes as {value, source}; the source says
   where it was found ("email body", "subject", "RFQ-26-0931.pdf (OCR 88%)"), and shows on hover.
   One entry per email: the record on screen, the key it was fetched for, and any fetch in flight. */
const RD = { map: new Map(), showSrc: false, open: new Set(), openFor: null };  // open: "N more" lists expanded
try { RD.showSrc = localStorage.getItem("rfq.showSources") === "1"; } catch (e) { /* storage blocked */ }

function rfqEnabled() { return !!(S.boot && S.boot.features && S.boot.features.rfq_details); }

// The record changes when Jev's decision does (is_rfq, and the routing columns) and when the server
// finishes reading a file (its text feeds every other field).
function rfqKey(id) {
  const it = S.state.items[id] || {}, e = S.emails[id] || {};
  const d = it.status === "done" && it.decision ? it.decision : null;
  return JSON.stringify([d ? [d.is_rfq, d.lane, d.lane_name, d.owner, d.priority, d.due] : null,
    (e.attachments || []).map((a) => a.text_from || a.label || "")]);
}

function ensureRfq(id, force) {
  if (!rfqEnabled() || !id || !S.emails[id] || !S.state) return;
  const key = rfqKey(id);
  let ent = RD.map.get(id);
  if (!ent) { ent = { key: null, status: "loading", record: null, error: "", noneWhy: "", pending: null, seq: 0 }; RD.map.set(id, ent); }
  if (!force && (ent.pending === key || (ent.pending == null && ent.key === key))) return;
  const seq = ++ent.seq;
  ent.pending = key;
  if (ent.status === "error" && !ent.record) ent.status = "loading";
  fetch(`/api/rfq_details/${encodeURIComponent(id)}`).then(async (res) => {
    const data = await res.json().catch(() => null);
    if (!res.ok || !data) throw new Error((data && typeof data.error === "string" && data.error) || `${res.status} ${res.statusText}`.trim() || "Request failed");
    return data;
  }).then((data) => {
    if (seq !== ent.seq) return;  // a newer request replaced this one
    ent.record = data.ok && data.record ? data.record : null;
    ent.status = ent.record ? "ok" : "none";
    ent.error = "";
    // A server that says why there is no record ({"ok": false, "error": "..."}) gets its reason shown.
    ent.noneWhy = !ent.record && typeof data.error === "string" ? data.error : "";
  }).catch((err) => {
    if (seq !== ent.seq) return;
    ent.status = "error"; ent.error = err.message || "Request failed";
  }).finally(() => {
    if (seq !== ent.seq) return;
    ent.pending = null; ent.key = key;
    updateRfqSection(id);
  });
  updateRfqSection(id);
}

function updateRfqSection(id) {
  if (S.drawer !== "email" || S.selected !== id) return;
  const sec = $("#rfqSec");
  if (!sec) return;
  const html = rfqInnerSafe(id);
  if (sec._html === html) return;
  const sc = sec.querySelector(".rd-scroll"), left = sc ? sc.scrollLeft : 0;
  // Every control in the section has an id, so focus comes back to the same one after the repaint;
  // a control that is gone (Try again, once the record loads) hands focus to Download all.
  const active = document.activeElement, focusId = active && sec.contains(active) ? active.id : "";
  sec.innerHTML = html; sec._html = html; rdHint();
  const sc2 = sec.querySelector(".rd-scroll"); if (sc2 && left) sc2.scrollLeft = left;
  if (focusId) { const el = (sec.querySelector(`#${CSS.escape(focusId)}`)) || $("#rdDl"); if (el) el.focus({ preventScroll: true }); }
}

function rfqInnerSafe(id) {
  try { return rfqInner(id); } catch (err) {
    // A record in a shape this page does not know must not leave the previous email's details up.
    console.warn("RFQ details could not be shown", err);
    return `<div class="sec-title">RFQ details</div><div class="err-box">These RFQ details came back in a form this page cannot show (${esc(err.message)}). The CSV download still has them.</div>`;
  }
}

// "3 more" under a list: the button stays in place (reading "Show fewer" when open), so keyboard
// focus never lands on something that just disappeared, and the choice survives a refresh.
function toggleMore(key) {
  const sec = $("#rfqSec"), btn = $(`#rdMore-${key}`), rest = $(`#rdRest-${key}`);
  if (!sec || !btn || !rest) return;
  const open = !RD.open.has(key);
  if (open) RD.open.add(key); else RD.open.delete(key);
  rest.hidden = !open;
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  btn.textContent = open ? "Show fewer" : btn.dataset.more;
  sec._html = rfqInnerSafe(S.selected);
}
function moreHtml(key, rest, item, cls) {
  if (!rest.length) return "";
  const open = RD.open.has(key), label = `${rest.length} more`;
  return `<ul class="${cls ? cls + " " : ""}rd-rest" id="rdRest-${key}"${open ? "" : " hidden"}>${rest.map(item).join("")}</ul>`
    + `<button type="button" class="rd-morebtn" id="rdMore-${key}" data-more="${esc(label)}" data-more-key="${key}" aria-expanded="${open}" aria-controls="rdRest-${key}">${open ? "Show fewer" : esc(label)}</button>`;
}

// "Scroll sideways" shows only while the part table is wider than its box and not scrolled to its end.
function rdHint() {
  const sc = $("#rfqSec .rd-scroll"), hint = $("#rfqSec .rd-hint");
  if (!sc || !hint) return;
  const upd = () => { hint.hidden = sc.scrollWidth - sc.clientWidth - sc.scrollLeft < 4; };
  upd();
  if (!sc._hinted) { sc._hinted = true; sc.addEventListener("scroll", upd, { passive: true }); }
}
window.addEventListener("resize", () => { if (S.drawer === "email") rdHint(); });

function toggleSources() {
  RD.showSrc = !RD.showSrc;
  try { localStorage.setItem("rfq.showSources", RD.showSrc ? "1" : "0"); } catch (e) { /* storage blocked */ }
  const rd = $("#rfqSec .rd"), b = $("#rdSrc");
  if (rd) rd.classList.toggle("src-on", RD.showSrc);
  if (b) b.setAttribute("aria-pressed", RD.showSrc ? "true" : "false");
  const sec = $("#rfqSec"); if (sec) sec._html = rfqInnerSafe(S.selected);
  rdHint();  // the source lines change the table's width
}

// "RFQ-26-0931.pdf (OCR 88%)" or "OCR 88%" -> {conf: 88}; "(OCR)" -> {conf: null}; anything else -> null.
// Only the part that says how a file was read counts, so a file named "OCR scan.pdf" is not an OCR source.
function ocrInfo(source) {
  for (const part of String(source || "").split(/\s*;\s*/)) {
    const m = /(?:^|[(,]\s*)OCR(?:\s*(\d{1,3}(?:\.\d+)?)\s*%)?\s*(?:\)|$)/.exec(part.trim());
    if (m) return { conf: m[1] != null ? Math.round(parseFloat(m[1])) : null };
  }
  return null;
}

const LOW_OCR = 70;  // below this, Tesseract's own confidence says to check the value against the file
function ocrChip(source) {
  const o = ocrInfo(source);
  if (!o) return "";
  const low = o.conf != null && o.conf < LOW_OCR;
  const tip = `Read with Tesseract OCR${o.conf != null ? ` at ${o.conf}% confidence` : ""} from ${source}.${low ? " Low confidence: check this against the file." : ""}`;
  return `<span class="ocr-chip${low ? " low" : ""}" title="${esc(tip)}">OCR${o.conf != null ? ` ${o.conf}%` : ""}</span>`;
}

// A source for reading aloud or showing under a value: "From the email body and FR-3101.pdf".
function srcPhrase(source) {
  const named = { "email body": "the email body", subject: "the subject", "email signature": "the email signature", "email header": "the email header", "from line": "the From line" };
  const parts = String(source || "").split(/\s*;\s*/).filter(Boolean).map((p) => named[p.toLowerCase()] || p);
  return parts.length ? "From " + parts.join(" and ") : "";
}

function fmtDate(iso, short) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  if (!m) return String(iso || "");
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  if (d.getFullYear() !== +m[1] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[3]) return String(iso);  // "2026-02-31"
  const opts = short ? { weekday: "short", month: "short", day: "numeric" } : { weekday: "short", month: "short", day: "numeric", year: "numeric" };
  return isNaN(d) ? String(iso) : d.toLocaleDateString("en-US", opts);
}

const hasValue = (v) => v != null && v !== "" && !(Array.isArray(v) && !v.length);
// Records come from another module: a list may arrive as one value, a field as a bare value.
const arr = (x) => (Array.isArray(x) ? x : x == null || x === "" ? [] : [x]);
const fld = (x) => (x && typeof x === "object" && !Array.isArray(x) ? x : { value: x, source: null });
const fmtNum = (n) => (typeof n === "number" && isFinite(n) ? n.toLocaleString("en-US") : String(n));

/* One extracted value: the value (fmt returns escaped HTML), its source on hover, an OCR chip when OCR
   read it, and the source as text (visible with "Sources" on, read by screen readers always). */
function rdVal(field, fmt, empty = "Not found", after) {
  const f = field && typeof field === "object" && !Array.isArray(field) ? field : { value: field, source: null };
  if (!hasValue(f.value)) return `<span class="rd-miss">${esc(empty)}</span>`;
  const src = f.source ? String(f.source) : "";
  const html = fmt ? fmt(f.value, f) : esc(Array.isArray(f.value) ? f.value.join(", ") : f.value);
  return `<span class="rd-v"${src ? ` title="${esc("Source: " + src)}"` : ""}>${html}</span>${ocrChip(src)}${after ? after(f.value, f) : ""}${src ? `<span class="rd-src">${esc(srcPhrase(src))}</span>` : ""}`;
}

function rdList(items, key, emptyText) {
  const list = arr(items).filter((x) => x && hasValue(typeof x === "object" ? x.value : x));
  if (!list.length) return `<span class="rd-miss">${esc(emptyText)}</span>`;
  const li = (x) => `<li>${rdVal(x)}</li>`;
  return `<ul class="rd-list">${list.slice(0, 3).map(li).join("")}</ul>${moreHtml(key, list.slice(3), li, "rd-list")}`;
}

const QTY = (v) => esc((Array.isArray(v) ? v : [v]).map(fmtNum).join(" / "));
const RD_COLS = [
  ["part_number", "Part number", "pn"], ["rev", "Rev", "rev"], ["description", "Description", "w"], ["material", "Material", "w"],
  ["finish", "Finish", "w"], ["size", "Size", "w", true], ["quantities", "Quantities", "num", false, QTY], ["annual_usage", "Annual usage", "num", false, (v) => esc(fmtNum(v))],
];

function rdTable(lines) {
  // Size is rarely given, so its column shows only when a line has one.
  const cols = RD_COLS.filter(([k, , , optional]) => !optional || lines.some((ln) => ln && ln[k] && hasValue(ln[k].value)));
  const head = cols.map(([, label, cls]) => `<th scope="col" class="${cls}">${label}</th>`).join("");
  const rows = lines.map((ln) => `<tr>${cols.map(([k, , cls, , fmt], i) => {
    const cell = rdVal((ln || {})[k], fmt, "n/a");
    return i === 0 ? `<th scope="row" class="${cls}">${cell}</th>` : `<td class="${cls}">${cell}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="rd-scroll" id="rdTable" tabindex="0" role="region" aria-label="Part lines, scrolls sideways"><table class="rd-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rfqInner(id) {
  const ent = RD.map.get(id), e = S.emails[id] || {};
  const busy = ent && ent.pending != null && ent.status !== "loading" ? `<span class="spin" aria-hidden="true" title="Checking for changes"></span>` : "";
  const dl = `<a class="rd-dl" id="rdDl" href="/api/rfq_details.csv" download="rfq_details.csv" title="Every RFQ in the inbox, one row per part line">${ic("download", "sm")}Download all (CSV)</a>`;
  const title = (extra) => `<div class="sec-title">RFQ details${busy}<span class="aside">${extra}</span></div>`;
  if (!ent || (ent.status === "loading" && !ent.record)) {
    return title(dl) + `<div class="status-box" role="status"><span class="spin"></span>Reading the RFQ details</div>`;
  }
  if (ent.status === "error" && !ent.record) {
    return title(dl) + `<div class="err-box rd-err" role="alert"><span>Could not load the RFQ details (${esc(ent.error)}).</span><button type="button" class="btn small" id="rdRetry" data-rfq-retry>${ic("refresh", "sm")}Try again</button></div>`;
  }
  if (ent.status === "none") {
    const it = S.state.items[id] || {}, d = it.status === "done" ? it.decision : null;
    // The server answers "no record" both for a non-RFQ and when pulling the details out failed (it logs
    // why); when Jev routed the email as an RFQ it can only be the second.
    if ((d && d.is_rfq) || ent.noneWhy) {
      const who = d && d.is_rfq ? "Jev says this is a request for quote, but the" : "The";
      return title(dl) + `<div class="rd-none">${ic("alert", "sm")}<span>${who} server could not pull its details out (${ent.noneWhy ? esc(ent.noneWhy) : "its log says why"}), so it is not in the consolidated file. The routing is not affected.</span></div>`;
    }
    const et = d && it.jev && it.jev.answers ? it.jev.answers.email_type : null;
    const kind = et && et.choice ? optionLabel("email_type", et.choice) : "";
    const why = d ? `Jev says this is not a request for quote${kind ? ` (${esc(kind)})` : ""}` : "This does not look like a request for quote, and Jev has not routed it yet";
    return title(dl) + `<div class="rd-none">${ic("info", "sm")}<span>${why}, so there are no part details to pull out and it is not in the consolidated file.</span></div>`;
  }
  const r = ent.record || {};
  const stale = ent.status === "error" ? `<div class="rd-stale" role="alert">Could not refresh (${esc(ent.error)}). Showing the last details. <button type="button" class="btn small ghost" id="rdRetry" data-rfq-retry>Try again</button></div>` : "";
  const srcBtn = `<button type="button" class="rd-srcbtn" id="rdSrc" aria-pressed="${RD.showSrc ? "true" : "false"}" title="Show where each value was found">Sources</button>`;

  const tier = r.customer_tier ? ` <span class="badge tier">${esc(r.customer_tier)}-tier customer</span>` : r.customer ? ` <span class="badge prospect">${ic("spark", "sm")}New prospect</span>` : "";
  const customer = hasValue(r.customer) ? rdVal({ value: r.customer, source: r.customer_source || null }, null, "Not found", () => tier) : `<span class="rd-miss">Not found</span>`;
  const contact = hasValue(r.contact) || hasValue(r.contact_email)
    ? rdVal({ value: r.contact || r.contact_email, source: "email header" }, null, "Not found", () => (r.contact && r.contact_email ? ` <span class="rd-sub2">${esc(r.contact_email)}</span>` : "")) : `<span class="rd-miss">Not found</span>`;
  const request = hasValue(r.request) ? esc(String(r.request).replace(/^./, (c) => c.toUpperCase())) : `<span class="rd-miss">Not found</span>`;
  // The words the date came from, unless they only repeat it ("RESPOND BY 2026-10-09").
  const quoted = (text, value) => (hasValue(text) && !String(text).includes(String(value)) ? `<span class="rd-q">"${esc(text)}"</span>` : "");
  const respond = rdVal(r.respond_by, (v) => esc(fmtDate(v)), "Not found", (v, f) => quoted(f.text, v));
  const dv = fld(r.delivery), tv = fld(r.terms);
  const delivery = hasValue(dv.value)
    ? (dv.date ? rdVal(dv, (v, f) => esc(fmtDate(f.date)), "Not found", (v, f) => quoted(v, f.date)) : rdVal(dv)) : "";
  const terms = hasValue(tv.value) ? rdVal(tv) : "";
  const ex = fld(r.export_control);
  const where = String(ex.source || "").split(/\s*;\s*/).filter(Boolean)
    .map((p) => esc(p.replace(/\s*\((?:OCR[^)]*|text layer|STEP header)\)\s*$/i, "")).replace(/^(email body|subject|email signature)$/i, "the $1")).join(" and ");
  const exportHtml = hasValue(ex.value)
    ? `<span class="rd-v" title="${esc("Source: " + (ex.source || "unknown"))}"><span class="badge restricted">${ic("lock", "sm")}${esc(ex.value)}</span>${where ? ` found in ${where}` : ""}</span>${ocrChip(ex.source)}${ex.source ? `<span class="rd-src">${esc(srcPhrase(ex.source))}</span>` : ""}`
    : `<span class="rd-miss" title="No ITAR, EAR, or CUI marking in the email or its files">None found</span>`;
  const ro = r.routing && typeof r.routing === "object" ? r.routing : null;
  const routing = ro && (ro.lane || ro.estimator)
    ? [ro.lane, ro.estimator, ro.priority, ro.quote_by ? `quote by ${fmtDate(ro.quote_by, true)}` : ""].filter(Boolean).map((x) => `<span style="white-space:nowrap">${esc(x)}</span>`).join(" · ")
    : `<span class="rd-miss">Not routed yet. The CSV fills this in once Jev routes the email.</span>`;
  const rows = [
    ["Customer", customer], ["Contact", contact], ["RFQ number", rdVal(r.rfq_number)], ["Quote ref", rdVal(r.quote_ref, null, "None")],
    ["Request", request], ["Respond by", respond], delivery ? ["Delivery", delivery] : null, terms ? ["Terms", terms] : null,
    ["Export control", exportHtml], ["Requirements", rdList(r.requirements, "req", "None stated")], ["Routed to", routing],
  ].filter(Boolean);

  const lines = arr(r.lines).filter((ln) => ln && typeof ln === "object");
  const table = lines.length ? rdTable(lines) : `<div class="rd-miss" style="font-size:12.5px">No part lines found.</div>`;
  const missing = arr(r.missing).filter(Boolean);
  const flags = missing.length ? `<div class="rd-flags"><span class="lab">Missing</span>${missing.map((m) => `<span class="badge warning">${ic("alert", "sm")}${esc(String(m).replace(/^./, (c) => c.toUpperCase()))}</span>`).join("")}</div>` : "";
  const checks = arr(r.check).filter(Boolean);
  const checkLi = (c) => `<li>${ic("alert", "sm")}<span>${esc(c)}</span></li>`;
  const checkHtml = checks.length ? `<div class="rd-check" role="note"><div class="rd-check-head">Check</div><ul>${checks.slice(0, 3).map(checkLi).join("")}</ul>${moreHtml("check", checks.slice(3), checkLi, "")}</div>` : "";
  const files = arr(r.files).filter((f) => f && typeof f === "object" && f.name);
  const filesHtml = files.length ? `<div class="rd-files"><b>Read from</b> ${files.map((f) => esc(`${f.name} (${[f.type, f.capture && f.capture !== "digital" ? f.capture : "", f.text_from].filter(Boolean).join(", ")})`)).join(", ")}</div>` : "";

  return title(`${srcBtn}${dl}`) + `${stale}<div class="rd${RD.showSrc ? " src-on" : ""}">
      <dl class="rd-kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      <div class="rd-sub">Part lines<span class="rd-n">${lines.length}</span>${lines.length ? `<span class="rd-hint" hidden>Scroll sideways for more ${ic("chev-right", "sm")}</span>` : ""}</div>
      ${table}${flags}${checkHtml}${filesHtml}
    </div>`;
}

/* Slider changes go out one request at a time and always end on the latest values. Two requests in
   flight could reach the server out of order and leave it on the older value. */
const TH = { pending: null, busy: false, timer: 0 };
function queueThresholds(update) {
  TH.pending = Object.assign(TH.pending || {}, update);
  clearTimeout(TH.timer); TH.timer = setTimeout(flushThresholds, 120);
}
function flushThresholds() {
  if (TH.busy || !TH.pending) return;
  const body = TH.pending; TH.pending = null; TH.busy = true;
  api("/api/thresholds", body).then((r) => applyState(r.state)).catch((e) => toast(e.message))
    .finally(() => { TH.busy = false; flushThresholds(); });
}

function updateSettings() {
  const th = S.state.thresholds;
  const cc = $("#cacheCount"); if (cc && cc.textContent !== String(S.state.stats.cache_size)) cc.textContent = S.state.stats.cache_size;
  const sc = $("#savedCount"); if (sc) { const h = savedCountHtml(); if (sc.dataset.h !== h) { sc.innerHTML = h; sc.dataset.h = h; } }
  if (TH.busy || TH.pending) return;  // a slider change is on its way; a poll must not move the slider back

  if (ib && document.activeElement !== ib) { ib.value = th.export_control_restrict; $("#itarBarV").textContent = pct(parseFloat(ib.value)); }
}
