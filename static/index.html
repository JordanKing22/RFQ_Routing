<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ Router · Jev demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #fbfaf8;
  --ink: #16181c;
  --ink-2: #4a4d55;
  --muted: #7d8089;
  --line: #e7e5df;
  --line-2: #d8d5cd;
  --blue: #2a78d6;
  --blue-strong: #1c5cab;
  --blue-soft: #9ec5f4;
  --blue-track: #e3eefb;
  --orange: #eb6834;
  --aqua: #1baf7a;
  --amber: #fab219;
  --good: #0ca30c;
  --good-text: #006300;
  --serious: #ec835a;
  --critical: #d03b3b;
  --indigo: #5856d6;
  --img-green: #1e8e4e;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(22,24,28,.06), 0 1px 1px rgba(22,24,28,.04);
  --shadow-lg: 0 18px 50px rgba(22,24,28,.18), 0 2px 6px rgba(22,24,28,.08);
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body.viewing { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 13px; height: 13px; }
svg.i.lg { width: 20px; height: 20px; }
.thin-scroll { scrollbar-width: thin; scrollbar-color: #cfccc4 transparent; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; flex: none; }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand-sep { width: 1px; height: 22px; background: var(--line-2); flex: none; }
.shop { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.shop b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shop span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-pill { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 8px; }
.spacer { flex: 1; }
/* When the bar gets tight, the shop lines and the Jev pill both shorten with an ellipsis (the pill's
   full text is in its tooltip), so nothing overlaps. */
.conn { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 12px 5px 10px; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
#connText { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); }
.dot.warn { background: var(--amber); }
.dot.bad { background: var(--critical); }
.dot.live { background: var(--orange); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.actions { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; color: var(--ink); text-decoration: none; }
.btn:hover { background: #f3f2ee; }
.btn:focus-visible, .card:focus-visible, .row:focus-visible, .ftile:focus-visible, .ftile-x:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #2a2d33; }
.btn.primary .play { color: var(--orange); fill: var(--orange); stroke: var(--orange); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: #efeee9; }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { height: 30px; padding: 0 10px; font-size: 12px; }

/* ---------- banner ---------- */
.banner { display: none; margin: 16px 24px 0; padding: 12px 14px; border-radius: var(--radius); border: 1px solid; gap: 12px; align-items: flex-start; }
.banner.show { display: flex; }
.banner.warn { background: #fff8e6; border-color: #f3d68a; }
.banner.warn .bicon { color: #9a6a00; }
.banner.bad { background: #fdf0f0; border-color: #f0b9b9; }
.banner.bad .bicon { color: var(--critical); }
.banner.info { background: #eef5fd; border-color: #c4dbf6; }
.banner.info .bicon { color: var(--blue-strong); }
.banner .btitle { font-weight: 600; }
.banner .bbody { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.banner .bmain { flex: 1; min-width: 0; }
.countdown { font-variant-numeric: tabular-nums; font-weight: 700; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; padding: 16px 24px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile .label { font-size: 12px; color: var(--muted); font-weight: 500; }
.tile .value { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-top: 1px; white-space: nowrap; }
.tile .value small { font-size: 14px; color: var(--muted); font-weight: 500; }
.tile .sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.hidden { display: none; }

/* ---------- layout ---------- */
.main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; padding: 16px 24px 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none; }
.panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.panel-head .count { font-size: 12px; color: var(--muted); }
.panel-head .addr { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- inbox ---------- */
.inbox { position: sticky; top: 76px; max-height: calc(100vh - 92px); display: flex; flex-direction: column; overflow: hidden; }
.inbox-list { overflow-y: auto; overscroll-behavior: contain; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 9px; padding: 7px 12px 8px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--surface); width: 100%; text-align: left; border-left: 0; border-right: 0; border-top: 0; }
.row:hover { background: #f9f8f5; }
/* Off-screen rows are not rendered, so 100+ spinners during a replay cost only the visible ones. */
.inbox-list .row { content-visibility: auto; contain-intrinsic-size: auto 70px; }
.row:focus-visible { outline-offset: -2px; }
.row.sel { background: #eef5fd; }
.row .st { margin-top: 4px; display: grid; place-items: center; height: 13px; }
.row .rmain { min-width: 0; display: block; }
.row .line1 { display: flex; gap: 8px; align-items: baseline; font-size: 12px; line-height: 16px; color: var(--ink-2); }
.row .line1 .who { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.row .line1 .org { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); flex: 1 1 0; min-width: 0; }
.row .line1 .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; display: inline-flex; gap: 6px; align-items: center; }
.row .subj { display: block; font-size: 13px; line-height: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .snip { display: block; font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .dest { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--ink-2); min-width: 0; }
.row .dest .lname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .dest .prio { margin: 0; padding: 1px 4px; font-size: 9.5px; line-height: 11px; }
.row .dest.err { color: var(--critical); }
.row .dest.err .lname { white-space: nowrap; }
.row.done .subj { font-weight: 500; }
.st-idle { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.st-queued { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); animation: pulse 1.1s infinite; }
.spin { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--blue-track); border-top-color: var(--blue); animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.st-err { color: var(--critical); display: grid; }
.clip { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; flex: none; }
.clip svg.i.sm { width: 12px; height: 12px; }

/* lane markers */
.mk { width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--muted); }
.mk.estimating { background: var(--blue); }
.mk.itar { background: var(--ink); }
.mk.orders { background: var(--aqua); }
.mk.review { background: var(--amber); }
.mk.filtered { background: #b7b4ab; }

/* ---------- board ---------- */
.board { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.group { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.group-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 7px; flex: none; min-width: 0; }
.group-head h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.group-head span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lanes { display: grid; gap: 12px; }
.lanes.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.lanes.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lane { background: #efeee9; border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 150px; min-width: 0; overflow: hidden; }
.lane.itar { background: #ebecee; border-color: #d6d8dc; }
.lane-head { padding: 9px 11px 4px; flex: none; }
.lane-title { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; min-width: 0; }
.lane-title .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-title .n { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.lane-owner { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cards { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 6px; padding: 7px 8px 8px; scrollbar-width: thin; scrollbar-color: #cbc8bf transparent; }
.lane.itar .cards { scrollbar-color: #c3c6cc transparent; }
.empty { font-size: 12px; color: var(--muted); padding: 14px 8px; text-align: center; border: 1px dashed var(--line-2); border-radius: 8px; margin: 7px 8px 8px; flex: none; }

.card { position: relative; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px 5px; box-shadow: var(--shadow); cursor: pointer; text-align: left; width: 100%; }
.card:hover { border-color: var(--line-2); box-shadow: 0 3px 10px rgba(22,24,28,.08); }
.card.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
/* The glow is a pseudo-element whose opacity animates, so a 100-card reveal stays on the compositor. */
.card::after { content: ""; position: absolute; inset: -1px; border-radius: 8px; box-shadow: 0 0 0 3px rgba(235,104,52,.5); opacity: 0; pointer-events: none; }
.card.fresh { animation: arrive .32s cubic-bezier(.2,.8,.2,1); }
.card.fresh::after, .card.moved::after { animation: glow .75s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateX(-10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes glow { from { opacity: 1; } to { opacity: 0; } }
.card .csubj { font-size: 12.5px; font-weight: 600; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cmeta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; line-height: 15px; color: var(--muted); margin-top: 1px; min-width: 0; }
.card .cmeta .o { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cmeta .prio { margin: 0; padding: 1px 4px; font-size: 9.5px; line-height: 11px; }
.card .cfoot { display: flex; align-items: center; gap: 8px; margin-top: 4px; height: 16px; }
.card .badges { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px; height: 16px; overflow: hidden; }
.card .badge { font-size: 10px; line-height: 10px; padding: 2px 4px; border-radius: 4px; gap: 3px; }
.card .badge svg.i.sm { width: 10px; height: 10px; }
.card .cm { flex: 0 0 72px; display: flex; align-items: center; gap: 5px; font-size: 10.5px; }
.card .meter { height: 5px; }
.card .meter .tick { top: -2px; bottom: -2px; }
.key-mark { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 2px solid var(--surface); z-index: 1; }
.key-mark svg.i.sm { width: 11px; height: 11px; stroke-width: 3; }
.key-mark.ok { background: var(--good); }
.key-mark.bad { background: var(--critical); }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); background: #f3f2ee; color: var(--ink-2); white-space: nowrap; }
.badge.restricted { background: var(--ink); border-color: var(--ink); color: #fff; }
.badge.serious { background: #fdece4; border-color: #f4c6b2; color: #983915; }
.badge.warning { background: #fff5d9; border-color: #f1d690; color: #6f4b00; }
.badge.tier { background: #e8f0fc; border-color: #c9dcf6; color: var(--blue-strong); }
.badge.prospect { background: #e6f5ee; border-color: #bfe5d2; color: #0b6b47; }
.prio { font-size: 10px; font-weight: 700; letter-spacing: .02em; padding: 3px 5px; border-radius: 4px; flex: none; margin-top: 1px; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface-2); }
.prio.P1 { background: #fdece4; border-color: #f4c6b2; color: #983915; }
.prio.P2 { background: #e8f0fc; border-color: #c9dcf6; color: var(--blue-strong); }

/* meter */
.meter { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--blue-track); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--blue); }
.meter .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; opacity: .75; }
.meter.ink { background: #dcdde1; }
.meter.ink .fill { background: var(--ink); }
.mval { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); flex: none; }

/* how-it-works (empty board) */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; flex: none; }
.how .step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.how .num { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.how h4 { margin: 8px 0 3px; font-size: 14px; }
.how p { margin: 0; color: var(--ink-2); font-size: 13px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(22,24,28,.28); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40; }
.scrim.show { opacity: 1; pointer-events: auto; }
/* Closed, the drawer is also hidden (after it slides out), so its buttons leave the tab order and
   its shadow stops darkening the right edge of the page. */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); box-shadow: var(--shadow-lg); z-index: 50; transform: translateX(104%); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s linear .22s; display: flex; flex-direction: column; }
.drawer.show { transform: none; visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s; }
.dhead { display: flex; gap: 12px; align-items: flex-start; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 17px; line-height: 1.3; letter-spacing: -.01em; overflow-wrap: anywhere; }
.dhead .meta { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.dbody { overflow-y: auto; padding: 16px 20px 28px; flex: 1; }
.sec { margin-top: 18px; }
.sec:first-child { margin-top: 0; }
.sec-title { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.sec-title .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.decision { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface-2); }
.decision .dest { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
.decision .owner { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.decision .reason { font-size: 13px; margin-top: 8px; }
.decision .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.trace { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
.trace li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 8px 0 0; font-size: 13px; }
.trace .tk { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.trace .tk.pass { background: #e3f4e3; color: var(--good-text); }
.trace .tk.stop { background: #e3eefb; color: var(--blue-strong); }
.trace .tk.warn { background: #fff5d9; color: #6f4b00; }
.trace .tk.info, .trace .tk.done, .trace .tk.review { background: #efeee9; color: var(--ink-2); }
.trace b { font-weight: 600; }
.trace .td { color: var(--ink-2); }

.q { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.q-head { display: flex; align-items: baseline; gap: 8px; }
.q-head .ql { font-weight: 600; font-size: 13px; }
.q-head .qt { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.q-head .qa { margin-left: auto; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.opt { display: grid; grid-template-columns: 150px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 12px; margin-top: 6px; }
.opt .on { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt.win .on { color: var(--ink); font-weight: 600; }
.opt .pv { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.opt.win .pv { color: var(--ink); font-weight: 600; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--blue-track); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--blue-soft); min-width: 2px; }
.opt.win .bar .fill { background: var(--blue); }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .7; border-radius: 1px; }
.q-foot { font-size: 11px; color: var(--muted); margin-top: 7px; }

.draft { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.action-title { font-weight: 600; font-size: 13px; margin-bottom: 8px; }
.email-body { white-space: pre-wrap; font-size: 13px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.status-box { display: flex; gap: 10px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); font-size: 13px; }
.err-box { padding: 12px 14px; border: 1px solid #f0b9b9; background: #fdf0f0; border-radius: var(--radius); font-size: 13px; }

/* ---------- RFQ details (drawer) ---------- */
/* OCR marks: teal, a color no lane or flag uses, so "read by OCR" never reads as a warning or a route. */
.ocr-chip { display: inline-flex; align-items: center; margin-left: 5px; padding: 1px 4px; border-radius: 4px; font-size: 9.5px; font-weight: 700; letter-spacing: .03em; line-height: 12px; vertical-align: 1px; white-space: nowrap; background: #e3f3f4; border: 1px solid #b5dfe2; color: #0b5e66; cursor: help; }
.ocr-chip.low { background: #fff5d9; border-color: #f1d690; color: #6f4b00; }
.sec-title .rd-dl { display: inline-flex; align-items: center; gap: 5px; color: var(--blue-strong); font-weight: 600; font-size: 12px; text-decoration: none; white-space: nowrap; }
.sec-title .rd-dl:hover { text-decoration: underline; }
.sec-title .rd-dl:focus-visible, .rd-srcbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.sec-title .spin { width: 11px; height: 11px; border-width: 1.5px; }
.rd-srcbtn { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.rd-srcbtn:hover { background: #f3f2ee; }
.rd-srcbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.rd { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 12px 14px 13px; min-width: 0; }
.rd-kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 12.5px; line-height: 1.45; }
.rd-kv dt { color: var(--muted); }
.rd-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
/* Badges follow their value after a plain space, so a badge that wraps starts flush with the value. */
.rd-kv .badge { font-size: 10.5px; padding: 2px 5px; vertical-align: 1px; }
.rd-v[title] { cursor: help; border-radius: 3px; }
.rd-v[title]:hover { background: #ecebe5; box-shadow: 0 0 0 2px #ecebe5; }
.rd-miss { color: var(--muted); }
.rd-q { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.rd-sub2 { color: var(--muted); }
.rd:not(.src-on) .rd-src { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rd.src-on .rd-src { display: block; font-size: 11px; line-height: 1.35; color: #5c6f72; margin-top: 1px; }
.rd-list { list-style: none; margin: 0; padding: 0; }
.rd-list li { position: relative; padding-left: 11px; }
.rd-list li + li { margin-top: 3px; }
.rd-list li::before { content: ""; position: absolute; left: 1px; top: .6em; width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); }
.rd-rest { margin-top: 3px; }
.rd-check .rd-rest { margin-top: 4px; }
.rd-morebtn { display: inline-block; margin-top: 4px; padding: 0; border: 0; background: none; font: inherit; font-size: 12px; font-weight: 600; color: var(--blue-strong); cursor: pointer; }
.rd-morebtn:hover { text-decoration: underline; }
.rd-morebtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 3px; }
.rd-sub { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
.rd-sub .rd-n { font-weight: 500; color: var(--muted); }
.rd-sub .rd-hint { margin-left: auto; font-weight: 500; font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
/* The part table scrolls sideways inside its own box, never the drawer or the page; the part number
   column stays put, and soft shadows at the edges say there is more to either side. */
.rd-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; scrollbar-width: thin; scrollbar-color: #cfccc4 transparent;
  background: linear-gradient(to left, var(--surface) 30%, rgba(255,255,255,0)) right center / 32px 100% no-repeat local,
              radial-gradient(farthest-side at 100% 50%, rgba(22,24,28,.16), rgba(22,24,28,0)) right center / 12px 100% no-repeat scroll,
              var(--surface); }
.rd-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; line-height: 1.4; }
.rd-table thead th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 9px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.rd-table tbody th, .rd-table td { text-align: left; font-weight: 400; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
.rd-table tbody tr:last-child > * { border-bottom: 0; }
.rd-table .pn { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: inset -1px 0 0 var(--line); font-weight: 600; }
.rd-table .pn .rd-v { white-space: nowrap; }
/* Source lines wrap in every cell (the part number and quantities stay on one line) and are never bold,
   so with Sources on the sticky part number column stays narrow instead of covering the table. */
.rd-table .rd-src { white-space: normal; font-weight: 400; }
.rd-table thead th.pn { background: var(--surface-2); z-index: 2; }
.rd-table tbody th.pn { font-weight: 600; }
.rd-scroll:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#rfqSec .sec-title { flex-wrap: wrap; row-gap: 6px; }  /* on the narrowest phones the buttons drop below the title */
#rfqSec .sec-title .aside { display: inline-flex; align-items: center; gap: 10px; }
.rd-table .pn .ocr-chip { display: flex; width: max-content; margin: 3px 0 0; }
.rd-table .rev { min-width: 48px; }
.rd-table .w { min-width: 150px; }
.rd-table .num { white-space: nowrap; font-variant-numeric: tabular-nums; }
.rd-table td.num .ocr-chip { display: flex; width: max-content; margin: 3px 0 0; }
.rd-table .rd-miss { font-size: 11.5px; }
.rd-flags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 12px; }
.rd-flags .lab { font-size: 12px; color: var(--muted); margin-right: 2px; }
.rd-check { list-style: none; margin: 10px 0 0; padding: 8px 10px; border: 1px solid #f1d690; background: #fff9e8; border-radius: 8px; font-size: 12px; color: #5a3d00; }
.rd-check ul { list-style: none; margin: 0; padding: 0; }
.rd-check li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; overflow-wrap: anywhere; }
.rd-check li + li { margin-top: 4px; }
.rd-check svg { margin-top: 2px; color: #9a6a00; }
.rd-check .rd-morebtn { color: #6f4b00; margin-left: 20px; }
.rd-check-head { font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #6f4b00; margin-bottom: 5px; }
.rd-files { margin-top: 10px; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.rd-files b { font-weight: 600; color: var(--ink-2); }
.rd-none { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: var(--radius); font-size: 12.5px; color: var(--ink-2); }
.rd-none svg { margin-top: 2px; color: var(--muted); }
.rd-err { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rd-err .btn { margin-left: auto; }
.rd-stale { font-size: 12px; color: var(--critical); margin: 0 0 8px; }

/* ---------- attachment tiles ---------- */
.att-head { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; font-size: 12px; flex-wrap: wrap; }
.att-count { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink); font-size: 13px; }
.att-hint { color: var(--muted); }
.ftiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 9px; }
.ftiles:empty { display: none; }
.ftile-wrap { position: relative; min-width: 0; }
.ftile { position: relative; display: flex; flex-direction: column; width: 100%; height: 128px; padding: 0; margin: 0; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); overflow: hidden; text-align: left; box-shadow: var(--shadow); color: var(--ink); font: inherit; transition: box-shadow .15s, border-color .15s; }
button.ftile:hover { border-color: #c4c0b6; box-shadow: 0 4px 14px rgba(22,24,28,.12); }
button.ftile:hover .fprev::after { opacity: 1; }
.fprev { position: relative; display: block; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #ebe9e3; }
.fprev::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(22,24,28,.12), rgba(22,24,28,0) 55%); opacity: 0; transition: opacity .15s; pointer-events: none; }
.fprev.page img, .fpaper { position: absolute; left: 11px; right: 11px; top: 9px; width: calc(100% - 22px); height: calc(100% - 9px); background: #fff; box-shadow: 0 1px 3px rgba(22,24,28,.22), 0 0 0 .5px rgba(22,24,28,.08); }
.fprev.page img { object-fit: cover; object-position: top center; display: block; }
.fpaper { overflow: hidden; padding: 6px 7px; }
.fpaper-in { display: block; width: 200%; transform: scale(.5); transform-origin: 0 0; font: 10px/12.5px var(--font); color: #50535b; white-space: pre-line; overflow-wrap: anywhere; }
.fpages { position: absolute; right: 6px; bottom: 5px; font-size: 10px; font-weight: 600; color: var(--ink-2); background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.fprev.model { background: linear-gradient(155deg, #eef0fb 0%, #dfe2f5 100%); }
.fprev.model img { position: absolute; inset: 4px 8px 2px; width: calc(100% - 16px); height: calc(100% - 6px); object-fit: contain; mix-blend-mode: multiply; display: block; }
.f3d { position: absolute; left: 7px; top: 7px; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--indigo); border-radius: 4px; padding: 2px 5px; line-height: 1.2; }
.fschema { position: absolute; left: 8px; bottom: 5px; font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #4b4a9c; }
.fprev.image { background: #e9e8e3; }
.fprev.image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fprev.center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11.5px; color: var(--muted); text-align: center; padding: 6px 10px; }
.fprev.center svg.i { width: 22px; height: 22px; }
.fprev.center.pdf svg.i { color: var(--critical); }
.fprev.none { background: transparent; }
.fprev.busy { background: var(--surface-2); color: var(--ink-2); }
.fprev.busy img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .28; }
.fprev.busy > span { position: relative; }
.fprev.err { background: #fdf0f0; color: var(--critical); font-weight: 500; }
.fprev.broken img { display: none; }
.fprev.broken::before { content: "Preview unavailable"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11.5px; color: var(--muted); }
.fprog { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 4px; border-radius: 2px; background: var(--blue-track); overflow: hidden; }
.fprog i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .15s; }
.ffoot { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 9px 8px; border-top: 1px solid var(--line); background: var(--surface); min-width: 0; }
.ficon { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; flex: none; background: var(--muted); color: #fff; }
.ficon svg.i { width: 11px; height: 11px; stroke-width: 2.4; }
.ficon.pdf { background: var(--critical); }
.ficon.step { background: var(--indigo); }
.ficon.image { background: var(--img-green); }
.ftext { min-width: 0; display: flex; flex-direction: column; }
.fname { font-size: 12px; font-weight: 600; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fmeta { font-size: 11px; line-height: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flegend { position: absolute; top: 6px; right: 6px; z-index: 2; font-size: 10px; padding: 3px 5px; gap: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.flegend svg.i.sm { width: 10px; height: 10px; }
.focr { position: absolute; left: 6px; top: 6px; z-index: 2; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; line-height: 1.2; color: #fff; background: #0e6f78; border-radius: 4px; padding: 2px 5px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.ftile-wrap.removable .flegend { right: 20px; }
.ftile.nofile { border-style: dashed; background: var(--surface-2); box-shadow: none; }
.ftile.nofile .ffoot { background: transparent; border-top-style: dashed; }
.ftile.err { border-color: #f0b9b9; }
.ftile-wrap.marked .ftile { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink), 0 4px 14px rgba(22,24,28,.14); }
.fmark { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; display: flex; align-items: center; gap: 4px; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 600; padding: 3px 8px; }
.fmark svg.i.sm { width: 11px; height: 11px; }
.ftile-x { position: absolute; top: -7px; right: -7px; z-index: 3; width: 22px; height: 22px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--ink); color: #fff; border: 2px solid var(--surface); box-shadow: var(--shadow); }
.ftile-x:hover { background: #2f3238; }
.ftile-x svg.i.sm { width: 11px; height: 11px; stroke-width: 2.6; }
.mark-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 9px 11px; border-radius: 8px; background: #ebecee; border: 1px solid #d6d8dc; font-size: 12.5px; color: var(--ink); }
.mark-note svg { margin-top: 2px; }

/* settings */
.set-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row label, .set-row .set-label { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.set-row .help { font-size: 12px; color: var(--muted); margin-top: 3px; }
.set-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.set-line .btn { margin-left: auto; }
.set-line .set-btns { margin-left: auto; display: flex; gap: 6px; }
.set-line .set-btns .btn { margin-left: 0; }
.range { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.range input[type=range] { flex: 1; accent-color: var(--ink); }
.range .rv { font-variant-numeric: tabular-nums; font-weight: 700; width: 44px; text-align: right; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--ink); }
.qlist .qi { padding: 10px 0; border-bottom: 1px solid var(--line); }
.qlist .qi:last-child { border-bottom: 0; }
.qlist .qn { font-weight: 600; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.qlist .qins { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.qlist details { margin-top: 4px; font-size: 12px; color: var(--muted); }
.qlist details li { margin: 2px 0; }
code { font-family: var(--mono); font-size: 12px; background: #f1f0ec; padding: 1px 5px; border-radius: 4px; }

/* modal */
.modal { position: fixed; left: 50%; top: 50%; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; transform: translate(-50%, -48%) scale(.98); opacity: 0; pointer-events: none; transition: all .18s; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 60; visibility: hidden; }
.modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); visibility: visible; }
/* The modal scrolls as one box; its title bar and its Route button stay in view (at 1280x720 and on
   phones the form is taller than the screen). z-index sits above the file tiles' badges. */
.mhead { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; background: var(--surface); border-radius: 14px 14px 0 0; }
.mhead h2 { margin: 0; font-size: 16px; }
.mbody { padding: 16px 20px; display: grid; gap: 12px; }
.field { min-width: 0; }
.field > label, .flabel { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
.flabel-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.flabel-row .flabel { margin: 0; }
.flabel-row .note { margin: 0 0 0 auto; }
.dropzone { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 11px 12px 11px 14px; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; transition: background .15s, border-color .15s; }
.dropzone.over { border-color: var(--blue); background: #eef5fd; }
.dropzone .dz-i { color: var(--muted); }
.dropzone .dz-t { flex: 1; min-width: 180px; }
.dropzone .dz-t b { color: var(--ink); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mfoot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); position: sticky; bottom: 0; z-index: 5; background: var(--surface); border-radius: 0 0 14px 14px; }
.mfoot .note { margin: 0 auto 0 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow-lg); transition: all .2s; z-index: 90; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
footer { padding: 0 24px 28px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

/* ---------- file viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; background: #1c1e23; color: #fff; }
.vbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 58px; border-bottom: 1px solid rgba(255,255,255,.09); flex: none; }
.vbar .ficon { width: 26px; height: 26px; border-radius: 6px; }
.vbar .ficon svg.i { width: 15px; height: 15px; }
.vtitle { flex: 1 1 auto; min-width: 0; }
.vname { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vmeta { font-size: 12px; color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.vactions { display: flex; align-items: center; gap: 8px; flex: none; }
.vnav { display: flex; align-items: center; gap: 4px; font-size: 12px; color: rgba(255,255,255,.72); font-variant-numeric: tabular-nums; margin-right: 4px; }
.vnav span { min-width: 46px; text-align: center; }
.vbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; min-width: 34px; padding: 0 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #fff; font-weight: 600; font-size: 12.5px; text-decoration: none; white-space: nowrap; }
.vbtn:hover { background: rgba(255,255,255,.14); }
.vbtn.icon { padding: 0; width: 34px; }
.vbtn[aria-pressed="true"] { background: rgba(255,255,255,.92); color: var(--ink); border-color: transparent; }
.vbtn:focus-visible { outline: 2px solid var(--blue-soft); outline-offset: 2px; }
.vbody { flex: 1 1 auto; min-height: 0; display: flex; }
.vstage { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.vpdf { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; border-radius: 6px; background: #fff; }
.vimg { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
.vimg img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.45); background: #fff; }
.v3d { position: relative; flex: 1 1 auto; min-height: 240px; border-radius: 10px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #fbfcfe 0%, #e6e9f1 62%, #d5dae4 100%); }
.v3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
.v3d canvas.grabbing { cursor: grabbing; }
.v3d canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--blue); }
.v3d-hint { position: absolute; left: 12px; bottom: 10px; max-width: calc(100% - 100px); font-size: 11.5px; color: var(--ink-2); background: rgba(255,255,255,.8); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
.v3d-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.v3d-tools .btn { height: 30px; background: rgba(255,255,255,.92); }
.v3d-load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.vprops { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 18px; margin: 0; padding: 12px 14px; background: #25282e; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; flex: none; }
.vprops div { min-width: 0; }
.vprops dt { font-size: 10.5px; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.vprops dd { margin: 2px 0 0; font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.vpanel { width: 340px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--surface); color: var(--ink); }
.vpanel.collapsed { display: none; }
.vpanel-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 16px; border-bottom: 1px solid var(--line); flex: none; }
.vpanel-head h3 { margin: 0; font-size: 14px; flex: 1; }
.vpanel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 16px 18px; scrollbar-width: thin; }
.vp-note { font-size: 12px; color: var(--muted); margin: 0; }
.vp-note + .vp-note { margin-top: 6px; }
.vp-warn { font-size: 12px; color: #6f4b00; background: #fff5d9; border: 1px solid #f1d690; border-radius: 6px; padding: 7px 9px; margin-top: 10px; }
.jtext { white-space: pre-wrap; overflow-wrap: anywhere; font: 11.5px/1.6 var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0 0; color: var(--ink); }
.vp-loading { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.vp-ocr { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.45; color: #0b4f56; background: #e3f3f4; border: 1px solid #b5dfe2; border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
.vp-ocr svg { margin-top: 2px; }
.vp-ocr.low { color: #5a3d00; background: #fff5d9; border-color: #f1d690; }
/* Detected regions: page 1 as an image, with the layout model's boxes on top. Boxes are placed in
   percent of the page, so they follow the image whenever its box is resized. */
.vreg { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.vreg-view { position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
.vreg-page { position: relative; flex: none; visibility: hidden; background: #fff; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.vreg-page.ready { visibility: visible; }
.vreg-page img { display: block; width: 100%; height: 100%; border-radius: 4px; }
.vreg-box { position: absolute; border: 2px solid var(--c); background: var(--bg); border-radius: 2px; pointer-events: none; }
.vreg-chip { position: absolute; left: -2px; bottom: 100%; margin-bottom: 1px; padding: 1px 6px; border-radius: 3px; background: var(--c); color: #fff; font-size: 11px; font-weight: 600; line-height: 16px; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.vreg-chip b { font-weight: 700; opacity: .85; margin-left: 3px; font-variant-numeric: tabular-nums; }
.vreg-box.chip-in .vreg-chip { bottom: auto; top: -2px; margin: 0; }
.vreg-box.chip-r .vreg-chip { left: auto; right: -2px; }
.vreg-load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: rgba(255,255,255,.75); font-size: 13px; }
.vreg-legend { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 40px; padding: 8px 12px; font-size: 12px; color: rgba(255,255,255,.85); background: #25282e; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; }
.vreg-key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.vreg-sw { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--c); background: var(--bg); flex: none; }
.vreg-key .n { color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
.vreg-meta { margin-left: auto; color: rgba(255,255,255,.55); white-space: nowrap; }
.vreg-note { display: flex; align-items: flex-start; gap: 8px; line-height: 1.45; }
.vreg-note svg { margin-top: 2px; flex: none; }
.vreg-note.warn svg { color: var(--amber); }
.vreg-legend code { background: rgba(255,255,255,.12); color: #fff; }
.vmsg { margin: auto; max-width: 460px; text-align: center; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 24px 22px; box-shadow: var(--shadow-lg); }
.vmsg .vmsg-i { width: 42px; height: 42px; border-radius: 10px; margin: 0 auto 10px; display: grid; place-items: center; background: #f3f2ee; color: var(--ink-2); }
.vmsg h3 { margin: 0 0 6px; font-size: 16px; }
.vmsg p { margin: 0; color: var(--ink-2); font-size: 13px; }

@media (min-width: 981px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .top, .banner, .stats, footer { flex: none; }
  .main { flex: 1; min-height: 0; align-items: stretch; padding-bottom: 12px; }
  .inbox { position: static; max-height: none; height: 100%; min-height: 0; }
  .inbox-list { flex: 1; min-height: 0; }
  .board { height: 100%; min-height: 0; overflow-y: auto; padding: 0 4px 2px 0; scrollbar-width: thin; }
  .group { flex: 1 1 0; min-height: 230px; }
  .lanes { flex: 1 1 auto; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
  .lane { min-height: 0; }
  footer { padding: 0 24px 10px; }
}
@media (max-width: 1180px) { .lanes.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lanes.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } .conn .long { display: none; } }
/* The download button goes icon-only before the brand and the Jev pill would have to squeeze. */
@media (max-width: 1320px) { #detailsBtn { width: 36px; padding: 0; justify-content: center; } #detailsBtn .label { display: none; } }
@media (min-width: 981px) and (max-width: 1180px) { .group.est { flex-grow: 2; min-height: 440px; } }
@media (max-width: 980px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .inbox { position: static; max-height: 420px; }
  .how { grid-template-columns: minmax(0, 1fr); }
  .lanes.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lane { max-height: 420px; }
  .top { flex-wrap: wrap; }
  .conn { display: none; }
}
@media (max-width: 760px) {
  .vbar { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
  .vtitle { flex-basis: calc(100% - 90px); }
  #vClose { order: 2; }
  .vactions { order: 3; width: 100%; }
  .vactions .vnav { margin-right: auto; }
  .vbtn .label { display: none; }
  .vbtn { padding: 0; width: 34px; }
  .vbody { flex-direction: column; overflow-y: auto; }
  .vstage { flex: none; height: 62vh; padding: 10px; }
  .vstage.model { height: auto; }
  .vstage.model .v3d { flex: none; height: 48vh; }
  .vpanel { width: auto; flex: none; }
  .vpanel-body { overflow: visible; }
  .vreg-legend { gap: 4px 12px; padding: 7px 10px; font-size: 11.5px; }
  .vreg-chip { font-size: 9.5px; line-height: 13px; padding: 0 4px; }
  .vreg-box { border-width: 1.5px; }
  .vreg-meta { margin-left: 0; }
}
@media (max-width: 640px) {
  .top, .stats, .main, footer { padding-left: 16px; padding-right: 16px; }
  .banner { margin-left: 16px; margin-right: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lanes.four, .lanes.three { grid-template-columns: minmax(0, 1fr); }
  .lane { max-height: 360px; }
  .brand-sep, .shop { display: none; }
  .actions .label { display: none; }
  .two { grid-template-columns: 1fr; }
  .opt { grid-template-columns: 96px minmax(0, 1fr) 36px; }
  .dbody { padding: 14px 16px 24px; }
  .dhead { padding: 16px 16px 12px; }
  .ftiles { gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mbody, .mhead, .mfoot { padding-left: 16px; padding-right: 16px; }
  .mfoot { flex-wrap: wrap; }
  .mfoot .note { flex-basis: 100%; }
  .mfoot .note:empty { display: none; }
  .group-head span { display: none; }
  /* At 360 px and below, a long answer ("Qty not stated · confidence 60%") and the draft's To line
     would push the drawer sideways: let them wrap. */
  .q-head { flex-wrap: wrap; }
  .q-head .qa { white-space: normal; }
  .draft-to { min-width: 0; overflow-wrap: anywhere; }
  .rd { padding: 10px 11px 11px; }
  .rd-kv { grid-template-columns: 90px minmax(0, 1fr); gap: 6px 10px; }
  .rd-table .w { min-width: 136px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#eb6834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l7 7-7 7"/><path d="M13 5l7 7-7 7" stroke="#ffffff"/></svg>
    </div>
    <div class="brand-name" id="product">RFQ Router</div>
    <div class="brand-sep"></div>
    <div class="shop"><b id="shopName">Shop</b><span id="shopSub"></span></div>
    <span class="demo-pill">Demo</span>
  </div>
  <div class="spacer"></div>
  <div class="conn" id="conn" title=""><span class="dot" id="connDot"></span><span id="connText">Connecting</span></div>
  <div class="actions">
    <button class="btn primary" id="routeBtn"></button>
    <button class="btn" id="pasteBtn"><svg class="i"><use href="#i-paste"/></svg><span class="label">Paste an RFQ</span></button>
    <a class="btn" id="detailsBtn" href="/api/rfq_details.csv" download="rfq_details.csv" hidden title="Download the details of every RFQ as one CSV file, one row per part line" aria-label="Download RFQ details (CSV)"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span class="label">RFQ details</span></a>
    <button class="btn ghost" id="resetBtn" title="Clear the board. Saved Jev results replay instantly."><svg class="i"><use href="#i-reset"/></svg><span class="label">Reset</span></button>
    <button class="btn ghost icon" id="settingsBtn" title="Settings and rules" aria-label="Settings and rules"><svg class="i"><use href="#i-sliders"/></svg></button>
  </div>
</header>

<div class="banner" id="banner" role="status" aria-live="polite"></div>

<section class="stats" id="stats" aria-label="Routing summary"></section>

<main class="main">
  <section class="panel inbox" aria-label="Inbox">
    <div class="panel-head">
      <svg class="i"><use href="#i-inbox"/></svg>
      <h2>Inbox</h2><span class="count" id="inboxCount"></span>
      <span class="addr" id="inboxAddr"></span>
    </div>
    <div class="inbox-list thin-scroll" id="inboxList"></div>
  </section>
  <section class="board" id="board" aria-label="Routing board"></section>
</main>
<footer id="footer"></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details" aria-hidden="true"></aside>

<div class="modal" id="pasteModal" role="dialog" aria-modal="true" aria-labelledby="pasteTitle">
  <div class="mhead">
    <svg class="i lg"><use href="#i-paste"/></svg>
    <h2 id="pasteTitle">Paste an RFQ</h2>
    <div class="spacer"></div>
    <button class="btn ghost icon" type="button" data-close="paste" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <form id="pasteForm">
    <div class="mbody">
      <div class="field">
        <label for="pExample">Start from an example (optional)</label>
        <select id="pExample"></select>
      </div>
      <div class="two">
        <div class="field"><label for="pName">From name</label><input id="pName" autocomplete="off" placeholder="Jane Smith"></div>
        <div class="field"><label for="pEmail">From email</label><input id="pEmail" autocomplete="off" placeholder="jane@customer.com"></div>
      </div>
      <div class="field"><label for="pSubject">Subject</label><input id="pSubject" autocomplete="off" placeholder="RFQ: bracket, 6061-T6, qty 50"></div>
      <div class="field"><label for="pBody">Email body</label><textarea id="pBody" placeholder="Paste the email text here"></textarea></div>
      <div class="field" id="pFilesField">
        <div class="flabel-row"><span class="flabel" id="pFilesLabel">Attachments</span><span class="note" id="pFilesCount"></span></div>
        <div class="dropzone" id="pDrop" aria-labelledby="pFilesLabel">
          <svg class="i lg dz-i" aria-hidden="true"><use href="#i-upload"/></svg>
          <span class="dz-t" id="pDropText"><b>Drop files here</b> or add them. PDF, PNG, or JPG.</span>
          <button type="button" class="btn small" id="pAddFiles"><svg class="i sm"><use href="#i-clip"/></svg>Add files</button>
          <input type="file" id="pFileInput" multiple accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" hidden>
        </div>
        <div class="note" id="pPdfNote" hidden>This server cannot read PDF text (pypdf is not installed), so Jev will only see the file names of PDFs.</div>
        <div class="ftiles" id="pFiles"></div>
      </div>
      <div class="field"><label for="pAtt">Other attachment names, no file (optional)</label><input id="pAtt" autocomplete="off" placeholder="part_revA.step, bracket_notes.pdf"></div>
    </div>
    <div class="mfoot">
      <span class="note" id="pFootNote"></span>
      <button type="button" class="btn ghost" data-close="paste">Cancel</button>
      <button type="submit" class="btn primary" id="pSubmit"><svg class="i play"><use href="#i-play"/></svg>Route with Jev</button>
    </div>
  </form>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vName" hidden>
  <div class="vbar">
    <span class="ficon" id="vIcon" aria-hidden="true"></span>
    <div class="vtitle"><div class="vname" id="vName"></div><div class="vmeta" id="vMeta"></div></div>
    <div class="vactions">
      <div class="vnav" id="vNav">
        <button class="vbtn icon" id="vPrev" type="button" aria-label="Previous file"><svg class="i"><use href="#i-chev-left"/></svg></button>
        <span id="vPos" aria-live="polite"></span>
        <button class="vbtn icon" id="vNext" type="button" aria-label="Next file"><svg class="i"><use href="#i-chev-right"/></svg></button>
      </div>
      <button class="vbtn" id="vRegionsBtn" type="button" aria-pressed="false" hidden title="Show the regions the layout model finds on page 1: title block, revisions, notes, legends, form tables"><svg class="i"><use href="#i-scan"/></svg><span class="label">Detected regions</span></button>
      <button class="vbtn" id="vPanelBtn" type="button" aria-pressed="true" aria-controls="vPanel" title="What Jev reads from this file"><svg class="i"><use href="#i-panel"/></svg><span class="label">Jev text</span></button>
      <a class="vbtn" id="vOpen" target="_blank" rel="noopener" title="Open in a new tab"><svg class="i"><use href="#i-external"/></svg><span class="label">Open</span></a>
      <a class="vbtn" id="vDownload" title="Download"><svg class="i"><use href="#i-download"/></svg><span class="label">Download</span></a>
    </div>
    <button class="vbtn icon" id="vClose" type="button" aria-label="Close viewer"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="vbody">
    <div class="vstage" id="vStage"></div>
    <aside class="vpanel" id="vPanel" aria-labelledby="vPanelTitle">
      <div class="vpanel-head"><h3 id="vPanelTitle">What Jev reads from this file</h3><button class="btn ghost icon small" id="vPanelClose" type="button" aria-label="Hide what Jev reads"><svg class="i"><use href="#i-x"/></svg></button></div>
      <div class="vpanel-body" id="vPanelBody"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
